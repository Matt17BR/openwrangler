name: Scoped agent instructions

on:
  pull_request:
    paths:
      - AGENTS.md
      - .github/AGENTS.md
      - docs/AGENTS.md
      - python/AGENTS.md
      - r/AGENTS.md
      - scripts/AGENTS.md
      - src/extension/AGENTS.md
      - src/shared/AGENTS.md
      - src/webviews/AGENTS.md
      - scripts/agent-instructions-context.mjs
      - scripts/agent-instructions-context.test.mjs
      - .github/workflows/scoped-agent-instructions.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - .github/AGENTS.md
      - docs/AGENTS.md
      - python/AGENTS.md
      - r/AGENTS.md
      - scripts/AGENTS.md
      - src/extension/AGENTS.md
      - src/shared/AGENTS.md
      - src/webviews/AGENTS.md
      - scripts/agent-instructions-context.mjs
      - scripts/agent-instructions-context.test.mjs
      - .github/workflows/scoped-agent-instructions.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate scoped agent instructions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate ancestor delivery and completion markers
        run: node scripts/agent-instructions-context.mjs
      - name: Test scoped instruction failures
        run: node --test scripts/agent-instructions-context.test.mjs
