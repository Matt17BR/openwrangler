        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: packaged_editor_r_remote
        name: Test remote R Jupyter in the exact packaged VSIX
        if: ${{ matrix.phase == 'r-remote' }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs ${{ steps.canonical_r_remote.outputs.candidate_path }}
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: remote-r-jupyter
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "1"
          VSCODE_TEST_VERSION: stable
      - name: Upload remote R-Jupyter failure diagnostics
        if: ${{ always() && steps.packaged_editor_r_remote.outcome == 'failure' && steps.packaged_editor_r_remote.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-r-jupyter-remote-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r_remote.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Fail after remote R-Jupyter diagnostics
        if: ${{ always() && steps.packaged_editor_r_remote.outcome == 'failure' }}
        run: exit 1

  r_contract:
    name: Native R contract
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - id: rscript
        name: Locate hosted Rscript
        shell: bash
        run: |
          set -euo pipefail
          rscript="$(command -v Rscript)"
          if [[ "$rscript" != /* || ! -x "$rscript" ]]; then
            echo "Rscript did not resolve to an absolute executable." >&2
            exit 1
          fi
          r_version="$(Rscript --vanilla -e 'cat(as.character(getRversion()))')"
          if [[ "$r_version" != "4.5.2" ]]; then
            echo "Expected hosted R 4.5.2, got $r_version." >&2
            exit 1
          fi
          printf 'executable=%s\n' "$rscript" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$r_version" >> "$GITHUB_OUTPUT"
          printf 'Hosted R: %s\n' "$r_version"
      - run: npm ci
      - name: Resolve R contract packages
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: ""
          extra-packages: |-
            any::jsonlite
            any::tibble
            any::readr
            any::dplyr
            any::data.table
            any::bit64
            any::collapse
            any::nanoparquet
          dependencies: '"hard"'
          cache: true
          cache-version: native-r-contract-v1
          install-pandoc: false
          install-quarto: false
      - run: npm run test:r-contract
        env:
          RSCRIPT: ${{ steps.rscript.outputs.executable }}

  r_local:
    name: Local R acceptance (${{ matrix.shard }})
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [lifecycle, editing]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - id: rscript
        name: Locate hosted Rscript
        shell: bash
        run: |
          set -euo pipefail
          rscript="$(command -v Rscript)"
          if [[ "$rscript" != /* || ! -x "$rscript" ]]; then
            echo "Rscript did not resolve to an absolute executable." >&2
            exit 1
          fi
          r_version="$(Rscript --vanilla -e 'cat(as.character(getRversion()))')"
          if [[ "$r_version" != "4.5.2" ]]; then
            echo "Expected hosted R 4.5.2, got $r_version." >&2
            exit 1
          fi
          printf 'executable=%s\n' "$rscript" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$r_version" >> "$GITHUB_OUTPUT"
          printf 'Hosted R: %s\n' "$r_version"
      - run: npm ci
      - name: Resolve local R packages
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: ""
          extra-packages: |-
            any::jsonlite
            any::tibble
            any::readr
            any::dplyr
            any::data.table
            any::bit64
            any::collapse
            any::nanoparquet
          dependencies: '"hard"'
          cache: true
          cache-version: native-r-contract-v1
          install-pandoc: false
          install-quarto: false
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: canonical-release
          merge-multiple: true
      - id: canonical
        name: Verify the exact canonical candidate artifact
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - run: npm run verify:vsix -- canonical-release/openwrangler.vsix
      - run: npm run build:test-extension
      - id: prepare_xvfb
        name: Prepare pinned private Xvfb
        shell: node {0}
        run: |
          const { execFileSync } = require("node:child_process");
          const { X_OK } = require("node:constants");
          const { accessSync, appendFileSync, lstatSync } = require("node:fs");
          const { isAbsolute } = require("node:path");

          const output = execFileSync(process.execPath, ["scripts/prepare-xvfb.mjs", "--print-path"], {
            cwd: process.cwd(),
            encoding: "utf8",
            stdio: ["ignore", "pipe", "inherit"]
          });
          if (!/^[^\0\r\n]+\n?$/u.test(output)) {
            throw new Error("The Xvfb preparer must print exactly one path.");
          }
          const executable = output.endsWith("\n") ? output.slice(0, -1) : output;
          if (!isAbsolute(executable)) throw new Error("The prepared Xvfb path must be absolute.");
          const stat = lstatSync(executable);
          if (!stat.isFile() || stat.isSymbolicLink()) {
            throw new Error("The prepared Xvfb path must be a regular, non-symlink file.");
          }
          accessSync(executable, X_OK);
          appendFileSync(process.env.GITHUB_OUTPUT, `executable=${executable}\n`, "utf8");
      - id: r_local_setup
        name: Confirm local R shard setup
        run: "true"
      - id: canonical_r_core
        name: Reverify the candidate for core R operations
        if: ${{ always() && matrix.shard == 'lifecycle' && steps.r_local_setup.outcome == 'success' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: packaged_editor_r_core
        name: Test core R operations in fresh packaged editor phases
        if: ${{ always() && matrix.shard == 'lifecycle' && steps.canonical_r_core.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs ${{ steps.canonical_r_core.outputs.candidate_path }}
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: core-operations
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode,cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload local R-Jupyter failure diagnostics
        if: ${{ always() && matrix.shard == 'lifecycle' && steps.packaged_editor_r_core.outcome == 'failure' && steps.packaged_editor_r_core.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-r-jupyter-local-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r_core.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: canonical_r_restart
        name: Reverify the candidate for R kernel restart
        if: ${{ always() && matrix.shard == 'lifecycle' && steps.r_local_setup.outcome == 'success' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: packaged_editor_r_restart
        name: Test R kernel restart in fresh packaged editor phases
        if: ${{ always() && matrix.shard == 'lifecycle' && steps.canonical_r_restart.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs ${{ steps.canonical_r_restart.outputs.candidate_path }}
        env:
