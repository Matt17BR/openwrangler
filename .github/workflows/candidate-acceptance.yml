name: Candidate acceptance

on:
  workflow_call:
    inputs:
      artifact_id:
        required: true
        type: string
      channel:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      release_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: Validate candidate inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require one supported candidate invocation
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          CHANNEL: ${{ inputs.channel }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$ARTIFACT_ID" in *[!0-9]*|"") exit 1 ;; esac
          case "$EXPECTED_SHA" in *[!0-9a-f]*|"") exit 1 ;; esac
          test "${#EXPECTED_SHA}" -eq 40
          test -n "$RELEASE_TAG"
          case "$CHANNEL" in preview|stable) ;; *) exit 1 ;; esac

  platform:
    name: Platform acceptance (${{ matrix.os }})
    needs: contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - id: rscript
        name: Locate hosted Rscript
        shell: Rscript {0}
        run: |
          version <- as.character(getRversion())
          if (!identical(version, "4.5.2")) stop("Expected hosted R 4.5.2, got ", version, ".")
          executable <- normalizePath(
            file.path(R.home("bin"), if (.Platform$OS.type == "windows") "Rscript.exe" else "Rscript"),
            winslash = "/",
            mustWork = TRUE
          )
          if (!nzchar(executable) || grepl("[\r\n]", executable)) stop("Rscript resolved to an unsafe path.")
          output <- Sys.getenv("GITHUB_OUTPUT")
          if (!nzchar(output)) stop("GITHUB_OUTPUT is not available.")
          cat(sprintf("executable=%s\nversion=%s\n", executable, version), file = output, append = TRUE)
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: canonical-release
          merge-multiple: true
      - id: canonical
        name: Verify the exact canonical candidate artifact
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - run: npm run verify:vsix -- canonical-release/openwrangler.vsix
      - run: npm run test:python-environment-smoke
      - run: npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: stable
      - run: npm run build:test-extension
      - id: canonical_vscode
        name: Reverify the candidate for cross-platform VS Code
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: packaged_editor
        name: Test packaged VS Code
        continue-on-error: true
        run: node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          VSCODE_TEST_VERSION: stable
      - name: Upload VS Code failure diagnostics
        if: ${{ always() && steps.packaged_editor.outcome == 'failure' && steps.packaged_editor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Fail after VS Code diagnostics
        if: ${{ always() && steps.packaged_editor.outcome == 'failure' }}
        run: exit 1
      - id: canonical_cursor
        name: Reverify the candidate for cross-platform Cursor
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: cursor_smoke
        name: Test pinned Cursor platform smoke
        continue-on-error: true
        run: node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: cursor
          OPEN_WRANGLER_PACKAGED_MODE: platform-smoke
      - name: Upload Cursor failure diagnostics
        if: ${{ always() && steps.cursor_smoke.outcome == 'failure' && steps.cursor_smoke.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-cursor-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.cursor_smoke.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Fail after Cursor diagnostics
        if: ${{ always() && steps.cursor_smoke.outcome == 'failure' }}
        run: exit 1
      - id: canonical_r_jupyter_platform
        name: Reverify the candidate for cross-platform R Jupyter
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: packaged_editor_r_platform
        name: Test local R Jupyter in packaged VS Code
        continue-on-error: true
        run: node scripts/run-packaged-editor-tests.mjs ${{ steps.canonical_r_jupyter_platform.outputs.candidate_path }}
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: core-operations
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload cross-platform R-Jupyter failure diagnostics
        if: ${{ always() && steps.packaged_editor_r_platform.outcome == 'failure' && steps.packaged_editor_r_platform.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-r-jupyter-platform-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r_platform.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Fail after cross-platform R-Jupyter diagnostics
        if: ${{ always() && steps.packaged_editor_r_platform.outcome == 'failure' }}
        run: exit 1

  linux:
    name: Linux release acceptance
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: python -m pip install "pandas>=2.2,<3.0" "pyspark[connect]==4.2.0"
      - name: Verify exact coverage runtimes
        run: |
          python - <<'PY'
          import pandas
          import pyspark
          from packaging.version import Version

          assert pyspark.__version__ == "4.2.0", pyspark.__version__
          assert Version("2.2") <= Version(pandas.__version__) < Version("3"), pandas.__version__
          PY
          java -XshowSettings:properties -version 2>&1 |
            grep -Eq '^[[:space:]]*java\.specification\.version = 17$'
      - run: python -m pip install --no-deps "https://files.pythonhosted.org/packages/90/b0/114463d056b6b328d45557001e848b8ab15539bd8f4fa7a457ccb83e2b5d/uv-0.11.32-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=3da76cd4e2697de30928b8a8524bd39183ac1e08cb7e72833807c022b7cba6c4"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: canonical-release
          merge-multiple: true
      - id: canonical
        name: Verify the exact canonical candidate artifact
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - run: npm run verify:vsix -- canonical-release/openwrangler.vsix
      - run: npm run check
      - name: Verify live repository metadata
        run: npm run repository:check-live
      - run: npm run test:scripts
      - id: webview_acceptance
        continue-on-error: true
        run: npm run test:webview-acceptance
      - name: Upload webview failure diagnostics
        if: ${{ always() && steps.webview_acceptance.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-webview-${{ github.run_attempt }}
          path: |
            tmp/screenshots-actual/
            tmp/screenshots-diff/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Fail after webview diagnostics
        if: ${{ always() && steps.webview_acceptance.outcome == 'failure' }}
        run: exit 1
      - run: npm run test:coverage
      - run: npm audit --omit=dev
      - run: npm run audit:python
      - run: npm run benchmark:runtime
      - run: npm run build:test-extension
      - id: canonical_vscode
        name: Reverify the candidate for VS Code
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: packaged_vscode
        name: Test the full package in headless VS Code
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          VSCODE_TEST_VERSION: stable
      - name: Upload VS Code failure diagnostics
        if: ${{ always() && steps.packaged_vscode.outcome == 'failure' && steps.packaged_vscode.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_vscode.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Fail after full VS Code diagnostics
        if: ${{ always() && steps.packaged_vscode.outcome == 'failure' }}
        run: exit 1
      - id: prepare_cursor_xvfb
        name: Prepare pinned private Xvfb for Cursor
        shell: node {0}
        run: |
          const { execFileSync } = require("node:child_process");
          const { X_OK } = require("node:constants");
          const { accessSync, appendFileSync, lstatSync } = require("node:fs");
          const { isAbsolute } = require("node:path");

          const output = execFileSync(process.execPath, ["scripts/prepare-xvfb.mjs", "--print-path"], {
            cwd: process.cwd(),
            encoding: "utf8",
            stdio: ["ignore", "pipe", "inherit"]
          });
          if (!/^[^\0\r\n]+\n?$/u.test(output)) {
            throw new Error("The Xvfb preparer must print exactly one path.");
          }
          const executable = output.endsWith("\n") ? output.slice(0, -1) : output;
          if (!isAbsolute(executable)) throw new Error("The prepared Xvfb path must be absolute.");
          const stat = lstatSync(executable);
          if (!stat.isFile() || stat.isSymbolicLink()) {
            throw new Error("The prepared Xvfb path must be a regular, non-symlink file.");
          }
          accessSync(executable, X_OK);
          appendFileSync(process.env.GITHUB_OUTPUT, `executable=${executable}\n`, "utf8");
      - id: canonical_cursor
        name: Reverify the candidate for Cursor
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: packaged_cursor
        name: Test the full package in private-display Cursor
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_cursor_xvfb.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload Cursor failure diagnostics
        if: ${{ always() && steps.packaged_cursor.outcome == 'failure' && steps.packaged_cursor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-cursor-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_cursor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Fail after full Cursor diagnostics
        if: ${{ always() && steps.packaged_cursor.outcome == 'failure' }}
        run: exit 1

  performance:
    name: Installed performance in pinned editors
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - name: Prepare exact local release tag
        if: ${{ inputs.channel == 'stable' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: canonical-release
          merge-multiple: true
      - id: canonical
        name: Verify the exact canonical candidate artifact
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: installed_performance
        name: Test the ordinary candidate artifact in pinned editors
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PREVIEW_FLAG: ${{ inputs.channel == 'preview' && '--preview-release' || '' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          /usr/bin/dbus-run-session -- npm run benchmark:installed --
          --pinned-editors
          $PREVIEW_FLAG
          --candidate-in canonical-release/openwrangler.vsix
          --candidate-checksum canonical-release/openwrangler.vsix.sha256
          --candidate-provenance canonical-release/openwrangler.vsix.provenance.json
          --out ${{ runner.temp }}/openwrangler-installed-performance-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Upload failed numeric installed-performance evidence
        if: ${{ always() && steps.installed_performance.outcome == 'failure' && steps.installed_performance.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-installed-performance-numeric-failure
          path: ${{ steps.installed_performance.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Fail after installed-performance diagnostics
        if: ${{ always() && steps.installed_performance.outcome == 'failure' }}
        run: exit 1
      - name: Upload installed-performance evidence
        if: ${{ steps.installed_performance.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-installed-performance
          path: ${{ runner.temp }}/openwrangler-installed-performance-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
          include-hidden-files: false

  jupyter:
    name: Released Jupyter acceptance (${{ matrix.phase == 'python' && 'Python' || 'R remote' }})
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        phase: [python, r-remote]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        if: ${{ matrix.phase == 'python' }}
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: python -m pip install --upgrade pip
        if: ${{ matrix.phase == 'python' }}
      - run: python -m pip install -e "python[dev]"
        if: ${{ matrix.phase == 'python' }}
      - run: python -m pip install --no-deps "https://files.pythonhosted.org/packages/90/b0/114463d056b6b328d45557001e848b8ab15539bd8f4fa7a457ccb83e2b5d/uv-0.11.32-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=3da76cd4e2697de30928b8a8524bd39183ac1e08cb7e72833807c022b7cba6c4"
        if: ${{ matrix.phase == 'python' }}
      - run: npm run lock:remote-jupyter:check
        if: ${{ matrix.phase == 'python' }}
      - run: npm run audit:remote-jupyter
        if: ${{ matrix.phase == 'python' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: canonical-release
          merge-multiple: true
      - id: canonical
        name: Verify the exact canonical candidate artifact
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - run: npm run verify:vsix -- canonical-release/openwrangler.vsix
      - run: npm run build:test-extension
      - id: prepare_xvfb
        name: Prepare pinned private Xvfb
        shell: node {0}
        run: |
          const { execFileSync } = require("node:child_process");
          const { X_OK } = require("node:constants");
          const { accessSync, appendFileSync, lstatSync } = require("node:fs");
          const { isAbsolute } = require("node:path");

          const output = execFileSync(process.execPath, ["scripts/prepare-xvfb.mjs", "--print-path"], {
            cwd: process.cwd(),
            encoding: "utf8",
            stdio: ["ignore", "pipe", "inherit"]
          });
          if (!/^[^\0\r\n]+\n?$/u.test(output)) {
            throw new Error("The Xvfb preparer must print exactly one path.");
          }
          const executable = output.endsWith("\n") ? output.slice(0, -1) : output;
          if (!isAbsolute(executable)) throw new Error("The prepared Xvfb path must be absolute.");
          const stat = lstatSync(executable);
          if (!stat.isFile() || stat.isSymbolicLink()) {
            throw new Error("The prepared Xvfb path must be a regular, non-symlink file.");
          }
          accessSync(executable, X_OK);
          appendFileSync(process.env.GITHUB_OUTPUT, `executable=${executable}\n`, "utf8");
      - id: canonical_jupyter
        name: Reverify the candidate for released Jupyter
        if: ${{ matrix.phase == 'python' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: packaged_editor
        name: Test released Jupyter in the exact packaged VSIX
        if: ${{ matrix.phase == 'python' }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode,cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
