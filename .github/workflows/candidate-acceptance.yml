          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload R kernel restart failure diagnostics
        if: ${{ always() && matrix.shard == 'lifecycle' && steps.packaged_editor_r_restart.outcome == 'failure' && steps.packaged_editor_r_restart.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-r-jupyter-restart-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r_restart.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: canonical_r_interactive
        name: Reverify the candidate for the active R terminal
        if: ${{ always() && matrix.shard == 'lifecycle' && steps.r_local_setup.outcome == 'success' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: packaged_editor_r_interactive
        name: Test the active R terminal in fresh packaged editor phases
        if: ${{ always() && matrix.shard == 'lifecycle' && steps.canonical_r_interactive.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs ${{ steps.canonical_r_interactive.outputs.candidate_path }}
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: interactive-terminal
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode,cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload active R terminal failure diagnostics
        if: ${{ always() && matrix.shard == 'lifecycle' && steps.packaged_editor_r_interactive.outcome == 'failure' && steps.packaged_editor_r_interactive.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-r-jupyter-interactive-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r_interactive.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: canonical_r_literate
        name: Reverify the candidate for R Markdown and Quarto
        if: ${{ always() && matrix.shard == 'lifecycle' && steps.r_local_setup.outcome == 'success' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: packaged_editor_r_literate
        name: Test R Markdown and Quarto in fresh packaged editor phases
        if: ${{ always() && matrix.shard == 'lifecycle' && steps.canonical_r_literate.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs ${{ steps.canonical_r_literate.outputs.candidate_path }}
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: literate-documents
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode,cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload R Markdown and Quarto failure diagnostics
        if: ${{ always() && matrix.shard == 'lifecycle' && steps.packaged_editor_r_literate.outcome == 'failure' && steps.packaged_editor_r_literate.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-r-jupyter-literate-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r_literate.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: canonical_r_values
        name: Reverify the candidate for value R operations
        if: ${{ always() && matrix.shard == 'editing' && steps.r_local_setup.outcome == 'success' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: packaged_editor_r_values
        name: Test value R operations in fresh packaged editor phases
        if: ${{ always() && matrix.shard == 'editing' && steps.canonical_r_values.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs ${{ steps.canonical_r_values.outputs.candidate_path }}
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: value-operations
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode,cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload value R-Jupyter failure diagnostics
        if: ${{ always() && matrix.shard == 'editing' && steps.packaged_editor_r_values.outcome == 'failure' && steps.packaged_editor_r_values.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-r-jupyter-values-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r_values.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: canonical_r_categorical
        name: Reverify the candidate for categorical R operations
        if: ${{ always() && matrix.shard == 'editing' && steps.r_local_setup.outcome == 'success' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/verify-${{ inputs.channel == 'preview' && 'preview' || 'canonical' }}-release-artifact.mjs canonical-release
      - id: packaged_editor_r_categorical
        name: Test categorical R operations in fresh packaged editor phases
        if: ${{ always() && matrix.shard == 'editing' && steps.canonical_r_categorical.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs ${{ steps.canonical_r_categorical.outputs.candidate_path }}
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: categorical-operations
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode,cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload categorical R-Jupyter failure diagnostics
        if: ${{ always() && matrix.shard == 'editing' && steps.packaged_editor_r_categorical.outcome == 'failure' && steps.packaged_editor_r_categorical.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-release-r-jupyter-categorical-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r_categorical.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Require successful local R shard outcomes
        if: ${{ always() }}
        env:
          SHARD: ${{ matrix.shard }}
          CORE_OUTCOME: ${{ steps.packaged_editor_r_core.outcome }}
          RESTART_OUTCOME: ${{ steps.packaged_editor_r_restart.outcome }}
          INTERACTIVE_OUTCOME: ${{ steps.packaged_editor_r_interactive.outcome }}
          LITERATE_OUTCOME: ${{ steps.packaged_editor_r_literate.outcome }}
          VALUES_OUTCOME: ${{ steps.packaged_editor_r_values.outcome }}
          CATEGORICAL_OUTCOME: ${{ steps.packaged_editor_r_categorical.outcome }}
        run: |
          set -euo pipefail
          case "$SHARD" in
            lifecycle)
              test "$CORE_OUTCOME" = "success"
              test "$RESTART_OUTCOME" = "success"
              test "$INTERACTIVE_OUTCOME" = "success"
              test "$LITERATE_OUTCOME" = "success"
              ;;
            editing)
              test "$VALUES_OUTCOME" = "success"
              test "$CATEGORICAL_OUTCOME" = "success"
              ;;
            *) exit 1 ;;
          esac

  acceptance:
    name: Candidate acceptance
    if: ${{ always() }}
    needs: [contract, platform, linux, performance, jupyter, r_contract, r_local]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every candidate acceptance result
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          JUPYTER_RESULT: ${{ needs.jupyter.result }}
          R_CONTRACT_RESULT: ${{ needs.r_contract.result }}
          R_LOCAL_RESULT: ${{ needs.r_local.result }}
        run: |
          set -euo pipefail
          test "$CONTRACT_RESULT" = "success"
          test "$PLATFORM_RESULT" = "success"
          test "$LINUX_RESULT" = "success"
          test "$PERFORMANCE_RESULT" = "success"
          test "$JUPYTER_RESULT" = "success"
          test "$R_CONTRACT_RESULT" = "success"
          test "$R_LOCAL_RESULT" = "success"
