name: Candidate acceptance

on:
  workflow_call:
    inputs:
      artifact_id:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      release_tag:
        required: true
        type: string
    outputs:
      performance_artifact_id:
        description: Installed-performance artifact ID
        value: ${{ jobs.performance.outputs.artifact-id }}
      performance_bytes:
        description: Installed-performance report byte size
        value: ${{ jobs.performance.outputs.report-bytes }}
      performance_sha256:
        description: Installed-performance report SHA-256
        value: ${{ jobs.performance.outputs.report-sha256 }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux and released Jupyter
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci --ignore-scripts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: npm run build:test-extension
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: canonical-release
          merge-multiple: true
      - id: setup
        name: Verify the candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: packaged_linux
        name: Test the installed product on Linux
        if: ${{ steps.setup.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          VSCODE_TEST_VERSION: stable
      - name: Upload Linux failure details
        if: ${{ always() && steps.packaged_linux.outcome == 'failure' && steps.packaged_linux.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-linux-${{ github.run_attempt }}
          path: ${{ steps.packaged_linux.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: prepare_xvfb
        name: Prepare the private Jupyter display
        if: ${{ always() && steps.setup.outcome == 'success' }}
        shell: node {0}
        run: |
          const { execFileSync } = require("node:child_process");
          const { X_OK } = require("node:constants");
          const { accessSync, appendFileSync, lstatSync } = require("node:fs");
          const { isAbsolute } = require("node:path");

          const output = execFileSync(process.execPath, ["scripts/prepare-xvfb.mjs", "--print-path"], {
            cwd: process.cwd(),
            encoding: "utf8",
            stdio: ["ignore", "pipe", "inherit"]
          });
          const executable = output.endsWith("\n") ? output.slice(0, -1) : output;
          if (!/^[^\0\r\n]+$/u.test(executable) || !isAbsolute(executable)) {
            throw new Error("The display preparer must return one absolute executable path.");
          }
          const stat = lstatSync(executable);
          if (!stat.isFile() || stat.isSymbolicLink()) {
            throw new Error("The prepared display executable must be a regular file.");
          }
          accessSync(executable, X_OK);
          appendFileSync(process.env.GITHUB_OUTPUT, `executable=${executable}\n`, "utf8");
      - id: canonical_jupyter
        name: Recheck the candidate before released Jupyter
        if: ${{ always() && steps.prepare_xvfb.outcome == 'success' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: packaged_jupyter
        name: Test the first Python and Jupyter use
        if: ${{ always() && steps.prepare_xvfb.outcome == 'success' && steps.canonical_jupyter.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_PACKAGED_PYTHON_JUPYTER_PROFILE: candidate-one-owner
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "1"
          VSCODE_TEST_VERSION: stable
      - name: Upload Jupyter failure details
        if: ${{ always() && steps.packaged_jupyter.outcome == 'failure' && steps.packaged_jupyter.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-jupyter-${{ github.run_attempt }}
          path: ${{ steps.packaged_jupyter.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Require both Linux journeys
        if: ${{ always() }}
        env:
          JUPYTER_RESULT: ${{ steps.packaged_jupyter.outcome }}
          LINUX_RESULT: ${{ steps.packaged_linux.outcome }}
        run: |
          test "$LINUX_RESULT" = "success"
          test "$JUPYTER_RESULT" = "success"

  platform:
    name: Installed smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: npm run build:test-extension
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: canonical-release
          merge-multiple: true
      - name: Verify the candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: packaged_platform
        name: Test the installed product
        continue-on-error: true
        run: node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_PACKAGED_MODE: platform-smoke
          VSCODE_TEST_VERSION: stable
      - name: Upload platform failure details
        if: ${{ always() && steps.packaged_platform.outcome == 'failure' && steps.packaged_platform.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-platform-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_platform.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Require the platform smoke
        if: ${{ always() && steps.packaged_platform.outcome == 'failure' }}
        run: exit 1

  r-local:
    name: Native R depth on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: ""
          extra-packages: |-
            any::jsonlite
            any::tibble
            any::readr
            any::dplyr
            any::data.table
            any::bit64
            any::rlang
            any::nanoparquet
            any::collapse
          dependencies: '"hard"'
          cache: true
          cache-version: native-r-contract-v2
          install-pandoc: false
          install-quarto: false
      - id: rscript
        name: Locate Rscript
        shell: bash
        run: |
          set -euo pipefail
          rscript="$(command -v Rscript)"
          test "${rscript#/}" != "$rscript"
          test -x "$rscript"
          printf 'executable=%s\n' "$rscript" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: npm run build:test-extension
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: canonical-release
          merge-multiple: true
      - id: setup
        name: Verify the candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: prepare_xvfb
        name: Prepare the private R display
        shell: node {0}
        run: |
          const { execFileSync } = require("node:child_process");
          const { X_OK } = require("node:constants");
          const { accessSync, appendFileSync, lstatSync } = require("node:fs");
          const { isAbsolute } = require("node:path");

          const output = execFileSync(process.execPath, ["scripts/prepare-xvfb.mjs", "--print-path"], {
            cwd: process.cwd(),
            encoding: "utf8",
            stdio: ["ignore", "pipe", "inherit"]
          });
          const executable = output.endsWith("\n") ? output.slice(0, -1) : output;
          if (!/^[^\0\r\n]+$/u.test(executable) || !isAbsolute(executable)) {
            throw new Error("The display preparer must return one absolute executable path.");
          }
          const stat = lstatSync(executable);
          if (!stat.isFile() || stat.isSymbolicLink()) {
            throw new Error("The prepared display executable must be a regular file.");
          }
          accessSync(executable, X_OK);
          appendFileSync(process.env.GITHUB_OUTPUT, `executable=${executable}\n`, "utf8");
      - name: Recheck the candidate for R core operations
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: r_core
        name: Test R lifecycle and core operations
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: core-operations
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload R core failure details
        if: ${{ always() && steps.r_core.outcome == 'failure' && steps.r_core.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-r-core-${{ github.run_attempt }}
          path: ${{ steps.r_core.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: canonical_r_frames
        name: Recheck the candidate for native R frames
        if: ${{ always() && steps.setup.outcome == 'success' && steps.prepare_xvfb.outcome == 'success' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: r_frames
        name: Test native R frames
        if: ${{ always() && steps.setup.outcome == 'success' && steps.prepare_xvfb.outcome == 'success' && steps.canonical_r_frames.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: native-frames
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload native R frame failure details
        if: ${{ always() && steps.r_frames.outcome == 'failure' && steps.r_frames.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-r-frames-${{ github.run_attempt }}
          path: ${{ steps.r_frames.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: canonical_r_restart
        name: Recheck the candidate for R restart recovery
        if: ${{ always() && steps.setup.outcome == 'success' && steps.prepare_xvfb.outcome == 'success' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: r_restart
        name: Test R kernel restart recovery
        if: ${{ always() && steps.setup.outcome == 'success' && steps.prepare_xvfb.outcome == 'success' && steps.canonical_r_restart.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: kernel-restart
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload R restart failure details
        if: ${{ always() && steps.r_restart.outcome == 'failure' && steps.r_restart.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-r-restart-${{ github.run_attempt }}
          path: ${{ steps.r_restart.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Require all Linux R journeys
        if: ${{ always() }}
        env:
          CORE_RESULT: ${{ steps.r_core.outcome }}
          FRAMES_RESULT: ${{ steps.r_frames.outcome }}
          RESTART_RESULT: ${{ steps.r_restart.outcome }}
        run: |
          test "$CORE_RESULT" = "success"
          test "$FRAMES_RESULT" = "success"
          test "$RESTART_RESULT" = "success"

  r-platform:
    name: Native R smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.12"
            r: "4.5.2"
          - os: windows-latest
            python: "3.14"
            r: "4.5.2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - id: rscript
        name: Locate Rscript
        shell: Rscript {0}
        run: |
          executable <- normalizePath(
            file.path(R.home("bin"), if (.Platform$OS.type == "windows") "Rscript.exe" else "Rscript"),
            winslash = "/",
            mustWork = TRUE
          )
          if (!nzchar(executable) || grepl("[\r\n]", executable)) stop("Rscript resolved to an unsafe path.")
          cat(sprintf("executable=%s\n", executable), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
      - run: npm ci --ignore-scripts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: npm run build:test-extension
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: canonical-release
          merge-multiple: true
      - name: Verify the candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: r_smoke
        name: Test native R lifecycle
        continue-on-error: true
        run: node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: core-operations
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload R platform failure details
        if: ${{ always() && steps.r_smoke.outcome == 'failure' && steps.r_smoke.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-r-platform-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.r_smoke.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Require the R platform smoke
        if: ${{ always() && steps.r_smoke.outcome == 'failure' }}
        run: exit 1

  performance:
    name: Installed performance
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.performance_artifact.outputs.artifact-id }}
      report-bytes: ${{ steps.performance_report.outputs.performance_bytes }}
      report-sha256: ${{ steps.performance_report.outputs.performance_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - id: inspection_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: canonical-release
          merge-multiple: true
      - name: Verify the performance candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node scripts/prepare-stable-candidate-tag.mjs
          node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: installed_performance
        name: Measure the installed candidate
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OPEN_WRANGLER_REMOTE_INSPECTION_PYTHON: ${{ steps.inspection_python.outputs.python-path }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          /usr/bin/dbus-run-session -- npm run benchmark:installed --
          --pinned-editors
          --editors vscode
          --candidate-in canonical-release/openwrangler.vsix
          --candidate-checksum canonical-release/openwrangler.vsix.sha256
          --candidate-provenance canonical-release/openwrangler.vsix.provenance.json
          --out ${{ runner.temp }}/release-candidate-performance.json
      - name: Upload numeric performance failure details
        if: ${{ always() && steps.installed_performance.outcome == 'failure' && steps.installed_performance.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-performance-failure-${{ github.run_attempt }}
          path: ${{ steps.installed_performance.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Require successful performance
        if: ${{ always() && steps.installed_performance.outcome == 'failure' }}
        run: exit 1
      - id: performance_report
        name: Bind the performance report
        if: ${{ steps.installed_performance.outcome == 'success' }}
        run: >-
          node scripts/release-candidate.mjs performance
          ${{ runner.temp }}/release-candidate-performance.json
      - id: performance_artifact
        name: Upload the performance report
        if: ${{ steps.installed_performance.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrangler-release-candidate-performance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate-performance.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
          include-hidden-files: false
