name: Prepared macOS R CLI availability experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    name: Exercise prepared helper admission and real R CLI availability
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build the experimental dependency before the consumer
        shell: bash
        run: |
          python - <<'PYBUILD'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import tempfile
          import time

          root = Path(tempfile.mkdtemp(prefix="ow-macos-cli-", dir=os.environ["RUNNER_TEMP"])).resolve()
          source = Path("scripts/r-contract-macos-experiment.c").resolve()
          binary = root / "native-helper"
          source_hash = hashlib.sha256(source.read_bytes()).hexdigest()
          assert source_hash == "0167543e6b3a72aea394f46706d133c26fbc571141f4d03053a943878c3abd33"
          started = time.perf_counter()
          report = {"sourceSha256": source_hash, "platform": platform.platform(),
                    "machine": platform.machine(), "compilerTreeCleanupQualified": False}
          try:
              result = subprocess.run(
                  ["xcrun", "clang", "-std=c11", "-O2", "-Wall", "-Wextra", "-Werror",
                   str(source), "-o", str(binary)], capture_output=True, timeout=20)
              report.update(returncode=result.returncode,
                            diagnostics=(result.stdout + result.stderr)[-8192:].decode("utf8", "replace"))
              assert result.returncode == 0, "Experimental helper compilation failed."
              binary.chmod(0o500)
              report["helperSha256"] = hashlib.sha256(binary.read_bytes()).hexdigest()
          finally:
              report["compileWallMs"] = (time.perf_counter() - started) * 1000
              (root / "preparation.json").write_text(json.dumps(report, indent=2) + "\n")
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  output.write(f"OPEN_WRANGLER_EXPERIMENT_MACOS_ROOT={root}\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"OPEN_WRANGLER_EXPERIMENT_MACOS_HELPER={binary}\n")
              output.write(f"OPEN_WRANGLER_EXPERIMENT_MACOS_HELPER_SHA256={report['helperSha256']}\n")
              output.write(f"OPEN_WRANGLER_EXPERIMENT_MACOS_SOURCE_SHA256={source_hash}\n")
          print(json.dumps(report))
          PYBUILD
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - id: rscript
        name: Locate the real selected Rscript
        shell: Rscript {0}
        run: |
          version <- as.character(getRversion())
          if (!identical(version, "4.5.2")) stop("Expected hosted R 4.5.2, got ", version, ".")
          executable <- normalizePath(file.path(R.home("bin"), "Rscript"), winslash = "/", mustWork = TRUE)
          if (!nzchar(executable) || grepl("[\r\n]", executable)) stop("Rscript resolved to an unsafe path.")
          output <- Sys.getenv("GITHUB_OUTPUT")
          if (!nzchar(output)) stop("GITHUB_OUTPUT is not available.")
          cat(sprintf("executable=%s\nversion=%s\n", executable, version), file = output, append = TRUE)
      - run: npm ci --ignore-scripts
      - name: Prepare the existing source-contract packages and observe actual defaults
        env:
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          OPEN_WRANGLER_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node scripts/r-contract-macos-experiment-check.mjs prepare-and-observe
      - name: Retain only bounded preparation and experiment receipts
        if: always() && env.OPEN_WRANGLER_EXPERIMENT_MACOS_ROOT != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-r-preparation-experiment
          path: |
            ${{ env.OPEN_WRANGLER_EXPERIMENT_MACOS_ROOT }}/preparation.json
            ${{ env.OPEN_WRANGLER_EXPERIMENT_MACOS_ROOT }}/r-preparation.json
            ${{ env.OPEN_WRANGLER_EXPERIMENT_MACOS_ROOT }}/result.json
          if-no-files-found: error
          retention-days: 7
