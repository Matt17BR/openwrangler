name: Cross-platform runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Cross-platform change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation_only: ${{ steps.classify.outputs.documentation_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: classify
        run: node scripts/ci-path-classification.mjs
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  runtime:
    needs: classify
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require exact change classification
        if: >-
          ${{
            needs.classify.result != 'success' ||
            (needs.classify.outputs.documentation_only != 'true' &&
             needs.classify.outputs.documentation_only != 'false')
          }}
        run: exit 1
      - name: Preserve required documentation-only context
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only == 'true' }}
        run: echo "Runtime source is unchanged; this matrix cell preserves its required check context."
      - uses: actions/checkout@v6
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only != 'true' }}
      - uses: actions/setup-node@v6
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only != 'true' }}
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only != 'true' }}
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: npm ci
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only != 'true' }}
      - run: python -m pip install --upgrade pip
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only != 'true' }}
      - run: python -m pip install -e "python[dev]"
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only != 'true' }}
      - run: npm run test:python-environment-smoke
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only != 'true' }}
      - run: python -m pytest python/tests -q
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only != 'true' }}

  dependency-guard-windows:
    name: Dependency guard (Windows, Python ${{ matrix.python }})
    needs: classify
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - name: Require exact change classification
        if: >-
          ${{
            needs.classify.result != 'success' ||
            (needs.classify.outputs.documentation_only != 'true' &&
             needs.classify.outputs.documentation_only != 'false')
          }}
        run: exit 1
      - name: Preserve required documentation-only context
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only == 'true' }}
        run: echo "Dependency guards are unchanged; this matrix cell preserves its required check context."
      - uses: actions/checkout@v6
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only != 'true' }}
      - uses: actions/setup-python@v6
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only != 'true' }}
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only != 'true' }}
      - run: python -m pytest python/tests/test_dependency_guard.py -q
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.documentation_only != 'true' }}
