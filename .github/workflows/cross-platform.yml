name: Cross-platform runtime

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install -e "python[dev]"
      - run: npm run test:python-environment-smoke
      - run: python -m pytest python/tests -q
      - run: npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: stable
  dependency-guard-windows:
    name: Dependency guard (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest python/tests/test_dependency_guard.py -q

  # BEGIN GENERATED PYTHON RUNTIME DEPENDENCY COHORTS
  python-runtime-dependency-cohorts:
    name: Exact Python dependency (${{ matrix.id }} ${{ matrix.version }}, Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "polars"
            python: "3.12"
            version: "1.35.2"
            requirement: "polars==1.35.2"
          - id: "polars"
            python: "3.12"
            version: "1.43.2"
            requirement: "polars==1.43.2"
          - id: "duckdb"
            python: "3.12"
            version: "1.5.4"
            requirement: "duckdb==1.5.4"
          - id: "duckdb"
            python: "3.12"
            version: "1.5.5"
            requirement: "duckdb==1.5.5"
          - id: "fsspec"
            python: "3.12"
            version: "2026.7.0"
            requirement: "fsspec==2026.7.0"
          - id: "pytz"
            python: "3.12"
            version: "2026.3.post1"
            requirement: "pytz==2026.3.post1"
          - id: "pandas"
            python: "3.12"
            version: "2.3.3"
            requirement: "pandas==2.3.3"
          - id: "pandas"
            python: "3.12"
            version: "3.0.5"
            requirement: "pandas==3.0.5"
          - id: "pyarrow"
            python: "3.12"
            version: "25.0.0"
            requirement: "pyarrow==25.0.0"
          - id: "pyarrow"
            python: "3.12"
            version: "25.0.1"
            requirement: "pyarrow==25.0.1"
          - id: "openpyxl"
            python: "3.12"
            version: "3.1.5"
            requirement: "openpyxl==3.1.5"
          - id: "xlrd"
            python: "3.12"
            version: "2.0.2"
            requirement: "xlrd==2.0.2"
          - id: "ipython"
            python: "3.10"
            version: "8.39.0"
            requirement: "ipython==8.39.0"
          - id: "ipython"
            python: "3.12"
            version: "9.15.0"
            requirement: "ipython==9.15.0"
          - id: "ipython"
            python: "3.12"
            version: "9.16.1"
            requirement: "ipython==9.16.1"
          - id: "fastexcel"
            python: "3.12"
            version: "0.20.2"
            requirement: "fastexcel==0.20.2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Open Wrangler and exact qualified dependency
        run: python -m pip install -e "python[dev]" "${{ matrix.requirement }}"
      - name: Exercise exact qualified dependency
        run: >-
          python -m pytest
          python/tests/test_runtime_dependency_authority.py::test_exact_qualified_dependency_probe
          -q
        env:
          OPENWRANGLER_QUALIFIED_DEPENDENCY_ID: ${{ matrix.id }}
          OPENWRANGLER_QUALIFIED_PYTHON_VERSION: ${{ matrix.python }}
          OPENWRANGLER_QUALIFIED_DEPENDENCY_VERSION: ${{ matrix.version }}
  # END GENERATED PYTHON RUNTIME DEPENDENCY COHORTS

  r-4-4-scheduled-qualification:
    name: Scheduled R 4.4 lock qualification
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.4"
          use-public-rspm: false
      - name: Install the declared system requirement
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libx11-dev
          dpkg-query --show --showformat='libx11-dev=${Version}\n' libx11-dev
      - run: npm ci --ignore-scripts
      - id: r_prepare
        run: >-
          node scripts/r-dependency-lock.mjs prepare
          --lock r/dependencies/native-r-contract/ubuntu-24.04-x86_64-r-4.4.lock.json
          --rscript "$(command -v Rscript)"
          --library "$RUNNER_TEMP/openwrangler-r-contract-4.4-scheduled-library"
          --archives "$RUNNER_TEMP/openwrangler-r-contract-4.4-scheduled-archives"
          --receipt "$RUNNER_TEMP/openwrangler-r-contract-4.4-scheduled-receipt.json"
      - id: r_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.r_prepare.outputs.archives }}
          key: ${{ steps.r_prepare.outputs.cache-key }}
          fail-on-cache-miss: false
      - run: >-
          node scripts/r-dependency-lock.mjs install
          --lock r/dependencies/native-r-contract/ubuntu-24.04-x86_64-r-4.4.lock.json
          --rscript "$(command -v Rscript)"
          --library "${{ steps.r_prepare.outputs.library }}"
          --archives "${{ steps.r_prepare.outputs.archives }}"
          --receipt "${{ steps.r_prepare.outputs.receipt }}"
          --cache-hit "${{ steps.r_cache.outputs.cache-hit == 'true' }}"
      - if: ${{ steps.r_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.r_prepare.outputs.archives }}
          key: ${{ steps.r_prepare.outputs.cache-key }}
      - run: npm run test:r-contract
        env:
          R_LIBS_USER: ${{ steps.r_prepare.outputs.library }}
