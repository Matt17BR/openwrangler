name: Cross-platform runtime

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Cross-platform change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      benchmark_harness_only: ${{ steps.classify.outputs.benchmark_harness_only }}
      dependency_lock_only: ${{ steps.classify.outputs.dependency_lock_only }}
      documentation_only: ${{ steps.classify.outputs.documentation_only }}
      draft_pull_request: ${{ steps.classify.outputs.draft_pull_request }}
      lightweight_only: ${{ steps.classify.outputs.lightweight_only }}
      package_only: ${{ steps.classify.outputs.package_only }}
      release_infrastructure_only: ${{ steps.classify.outputs.release_infrastructure_only }}
      full_matrix_required: ${{ steps.classify.outputs.full_matrix_required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: classify
        run: node scripts/ci-path-classification.mjs
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_DRAFT: ${{ github.event.pull_request.draft }}

  runtime:
    needs: classify
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require exact change classification
        if: >-
          ${{
            needs.classify.result != 'success' ||
            (needs.classify.outputs.benchmark_harness_only != 'true' &&
             needs.classify.outputs.benchmark_harness_only != 'false') ||
            (needs.classify.outputs.dependency_lock_only != 'true' &&
             needs.classify.outputs.dependency_lock_only != 'false') ||
            (needs.classify.outputs.documentation_only != 'true' &&
             needs.classify.outputs.documentation_only != 'false') ||
            (needs.classify.outputs.draft_pull_request != 'true' &&
             needs.classify.outputs.draft_pull_request != 'false') ||
            (needs.classify.outputs.lightweight_only != 'true' &&
             needs.classify.outputs.lightweight_only != 'false') ||
            (needs.classify.outputs.package_only != 'true' &&
             needs.classify.outputs.package_only != 'false') ||
            (needs.classify.outputs.release_infrastructure_only != 'true' &&
             needs.classify.outputs.release_infrastructure_only != 'false') ||
            (needs.classify.outputs.full_matrix_required != 'true' &&
             needs.classify.outputs.full_matrix_required != 'false') ||
            (needs.classify.outputs.lightweight_only == 'true' &&
             needs.classify.outputs.documentation_only == 'false' &&
             needs.classify.outputs.draft_pull_request == 'false') ||
            (needs.classify.outputs.lightweight_only == 'false' &&
             (needs.classify.outputs.documentation_only == 'true' ||
              needs.classify.outputs.draft_pull_request == 'true')) ||
            (needs.classify.outputs.documentation_only == 'true' &&
             needs.classify.outputs.package_only == 'true') ||
            (needs.classify.outputs.benchmark_harness_only == 'true' &&
             (needs.classify.outputs.documentation_only == 'true' ||
              needs.classify.outputs.package_only == 'true' ||
              needs.classify.outputs.dependency_lock_only == 'true' ||
              needs.classify.outputs.draft_pull_request == 'true')) ||
            (needs.classify.outputs.dependency_lock_only == 'true' &&
             (needs.classify.outputs.documentation_only == 'true' ||
              needs.classify.outputs.package_only == 'true')) ||
            (needs.classify.outputs.release_infrastructure_only == 'true' &&
             (needs.classify.outputs.benchmark_harness_only == 'true' ||
              needs.classify.outputs.documentation_only == 'true' ||
              needs.classify.outputs.package_only == 'true' ||
              needs.classify.outputs.dependency_lock_only == 'true' ||
              needs.classify.outputs.draft_pull_request == 'true')) ||
            (needs.classify.outputs.full_matrix_required == 'true' &&
             (needs.classify.outputs.benchmark_harness_only == 'true' ||
              needs.classify.outputs.documentation_only == 'true' ||
              needs.classify.outputs.package_only == 'true' ||
              needs.classify.outputs.dependency_lock_only == 'true' ||
              needs.classify.outputs.release_infrastructure_only == 'true' ||
              needs.classify.outputs.draft_pull_request == 'true')) ||
            (needs.classify.outputs.full_matrix_required == 'false' &&
             needs.classify.outputs.benchmark_harness_only == 'false' &&
             needs.classify.outputs.documentation_only == 'false' &&
             needs.classify.outputs.package_only == 'false' &&
             needs.classify.outputs.dependency_lock_only == 'false' &&
             needs.classify.outputs.release_infrastructure_only == 'false' &&
             needs.classify.outputs.draft_pull_request == 'false')
          }}
        run: exit 1
      - name: Preserve required non-matrix context
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'false' }}
        run: echo "Full runtime evidence is deferred; this matrix cell preserves its required check context."
      - uses: actions/checkout@v6
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
      - uses: actions/setup-node@v6
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: npm ci
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
      - run: python -m pip install --upgrade pip
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
      - run: python -m pip install -e "python[dev]"
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
      - run: npm run test:python-environment-smoke
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
      - run: python -m pytest python/tests -q
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
      - run: npm run test:extension-host
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
        env:
          VSCODE_TEST_VERSION: stable
      - run: npm run test:scripts:native
        if: >-
          ${{
            needs.classify.result == 'success' &&
            needs.classify.outputs.full_matrix_required == 'true' &&
            runner.os == 'Windows'
          }}

  dependency-guard-windows:
    name: Dependency guard (Windows, Python ${{ matrix.python }})
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - name: Require exact change classification
        if: >-
          ${{
            needs.classify.result != 'success' ||
            (needs.classify.outputs.benchmark_harness_only != 'true' &&
             needs.classify.outputs.benchmark_harness_only != 'false') ||
            (needs.classify.outputs.dependency_lock_only != 'true' &&
             needs.classify.outputs.dependency_lock_only != 'false') ||
            (needs.classify.outputs.documentation_only != 'true' &&
             needs.classify.outputs.documentation_only != 'false') ||
            (needs.classify.outputs.draft_pull_request != 'true' &&
             needs.classify.outputs.draft_pull_request != 'false') ||
            (needs.classify.outputs.lightweight_only != 'true' &&
             needs.classify.outputs.lightweight_only != 'false') ||
            (needs.classify.outputs.package_only != 'true' &&
             needs.classify.outputs.package_only != 'false') ||
            (needs.classify.outputs.release_infrastructure_only != 'true' &&
             needs.classify.outputs.release_infrastructure_only != 'false') ||
            (needs.classify.outputs.full_matrix_required != 'true' &&
             needs.classify.outputs.full_matrix_required != 'false') ||
            (needs.classify.outputs.lightweight_only == 'true' &&
             needs.classify.outputs.documentation_only == 'false' &&
             needs.classify.outputs.draft_pull_request == 'false') ||
            (needs.classify.outputs.lightweight_only == 'false' &&
             (needs.classify.outputs.documentation_only == 'true' ||
              needs.classify.outputs.draft_pull_request == 'true')) ||
            (needs.classify.outputs.documentation_only == 'true' &&
             needs.classify.outputs.package_only == 'true') ||
            (needs.classify.outputs.benchmark_harness_only == 'true' &&
             (needs.classify.outputs.documentation_only == 'true' ||
              needs.classify.outputs.package_only == 'true' ||
              needs.classify.outputs.dependency_lock_only == 'true' ||
              needs.classify.outputs.draft_pull_request == 'true')) ||
            (needs.classify.outputs.dependency_lock_only == 'true' &&
             (needs.classify.outputs.documentation_only == 'true' ||
              needs.classify.outputs.package_only == 'true')) ||
            (needs.classify.outputs.release_infrastructure_only == 'true' &&
             (needs.classify.outputs.benchmark_harness_only == 'true' ||
              needs.classify.outputs.documentation_only == 'true' ||
              needs.classify.outputs.package_only == 'true' ||
              needs.classify.outputs.dependency_lock_only == 'true' ||
              needs.classify.outputs.draft_pull_request == 'true')) ||
            (needs.classify.outputs.full_matrix_required == 'true' &&
             (needs.classify.outputs.benchmark_harness_only == 'true' ||
              needs.classify.outputs.documentation_only == 'true' ||
              needs.classify.outputs.package_only == 'true' ||
              needs.classify.outputs.dependency_lock_only == 'true' ||
              needs.classify.outputs.release_infrastructure_only == 'true' ||
              needs.classify.outputs.draft_pull_request == 'true')) ||
            (needs.classify.outputs.full_matrix_required == 'false' &&
             needs.classify.outputs.benchmark_harness_only == 'false' &&
             needs.classify.outputs.documentation_only == 'false' &&
             needs.classify.outputs.package_only == 'false' &&
             needs.classify.outputs.dependency_lock_only == 'false' &&
             needs.classify.outputs.release_infrastructure_only == 'false' &&
             needs.classify.outputs.draft_pull_request == 'false')
          }}
        run: exit 1
      - name: Preserve required non-matrix context
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'false' }}
        run: echo "Full dependency-guard evidence is deferred; this matrix cell preserves its required check context."
      - uses: actions/checkout@v6
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
      - uses: actions/setup-python@v6
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
      - run: python -m pytest python/tests/test_dependency_guard.py -q
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.full_matrix_required == 'true' }}
