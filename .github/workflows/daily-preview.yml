name: Daily preview

on:
  workflow_dispatch:
  schedule:
    - cron: "13 3 * * *"

permissions:
  contents: read

concurrency:
  group: daily-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Build and test daily preview
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require main
        env:
          EVENT_REF: ${{ github.ref }}
        run: test "$EVENT_REF" = "refs/heads/main"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install -e "python[dev]"
      - id: preview
        name: Assign a disposable version
        run: node scripts/daily-preview-artifact.mjs prepare
      - name: Build and package
        run: |
          node --input-type=module -e 'import { mkdirSync } from "node:fs"; mkdirSync("daily-preview", { mode: 0o700 });'
          npm run clean
          npm run build
          npm run package:prepared -- --out daily-preview/openwrangler.vsix
      - name: Check the VSIX
        run: npm run verify:vsix -- daily-preview/openwrangler.vsix
      - name: Build the installed-editor tests
        run: npm run build:test-extension
      - id: vscode
        name: Open the preview in VS Code
        run: node scripts/run-packaged-editor-tests.mjs daily-preview/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_PACKAGED_MODE: platform-smoke
          OPEN_WRANGLER_TEST_SELECTOR: daily-core
          VSCODE_TEST_VERSION: stable
      - name: Upload failure diagnostics
        if: ${{ failure() && steps.vscode.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-preview-vscode-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.vscode.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Upload the working preview
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrangler-daily-preview-${{ steps.preview.outputs.preview_id }}-${{ github.run_attempt }}
          path: daily-preview/openwrangler.vsix
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
      - name: Summarize the preview
        if: ${{ success() }}
        env:
          PREVIEW_ID: ${{ steps.preview.outputs.preview_id }}
          VERSION: ${{ steps.preview.outputs.extension_version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Daily preview"
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Preview: \`$PREVIEW_ID\` (version \`$VERSION\`)"
            echo "- Test: installed in stable VS Code, opened a CSV, rendered the grid, sorted a column, and closed cleanly"
            echo
            echo "The VSIX expires after 14 days and is not a release candidate."
          } >> "$GITHUB_STEP_SUMMARY"
