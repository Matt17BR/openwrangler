name: Stable release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful release-candidate workflow run ID
        required: true
        type: string
      release_tag:
        description: Stable tag qualified by that run, for example v2.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-train-${{ inputs.release_tag }}
  cancel-in-progress: false
  queue: max

jobs:
  select:
    name: Select the qualified candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      candidate-artifact-id: ${{ steps.candidate.outputs.candidate_artifact_id }}
      candidate-run-attempt: ${{ steps.candidate.outputs.candidate_run_attempt }}
      candidate-run-id: ${{ steps.candidate.outputs.candidate_run_id }}
      candidate-source-sha: ${{ steps.candidate.outputs.source_sha }}
      performance-artifact-id: ${{ steps.candidate.outputs.performance_artifact_id }}
      qualification-artifact-id: ${{ steps.candidate.outputs.qualification_artifact_id }}
    steps:
      - name: Require a dispatch from main
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          test "$EVENT_REF_TYPE" = "branch"
          test "$EVENT_REF" = "refs/heads/main"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - id: candidate
        name: Read the successful candidate run
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-candidate.mjs select
      - name: Require the candidate source to be current main
        env:
          CANDIDATE_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          CURRENT_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$CURRENT_MAIN_SHA"
          git cat-file -e "$CANDIDATE_SOURCE_SHA^{commit}"
          test "$CANDIDATE_SOURCE_SHA" = "$CURRENT_MAIN_SHA"

  publish:
    name: Publish the exact candidate to GitHub
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: publishing
    concurrency:
      group: openwrangler-release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.select.outputs.candidate-source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require the exact candidate source
        env:
          CANDIDATE_SOURCE_SHA: ${{ needs.select.outputs.candidate-source-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$CANDIDATE_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - id: release_metadata
        name: Validate stable release metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-metadata.mjs
      - name: Require stable metadata
        if: ${{ steps.release_metadata.outputs.prerelease != 'false' }}
        run: exit 1
      - name: Download the candidate bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.select.outputs.candidate-artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.select.outputs.candidate-run-id }}
          path: canonical-release
          merge-multiple: true
      - name: Download the qualification receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.select.outputs.qualification-artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.select.outputs.candidate-run-id }}
          path: qualification
          merge-multiple: true
      - name: Download the performance report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.select.outputs.performance-artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.select.outputs.candidate-run-id }}
          path: performance
          merge-multiple: true
      - id: canonical
        name: Verify the candidate bytes
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - name: Verify candidate qualification and performance
        env:
          CANDIDATE_ARTIFACT_ID: ${{ needs.select.outputs.candidate-artifact-id }}
          CANDIDATE_BYTES: ${{ steps.canonical.outputs.candidate_bytes }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.select.outputs.candidate-run-attempt }}
          CANDIDATE_RUN_ID: ${{ needs.select.outputs.candidate-run-id }}
          CANDIDATE_SHA256: ${{ steps.canonical.outputs.candidate_sha256 }}
          CANDIDATE_SOURCE_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PERFORMANCE_ARTIFACT_ID: ${{ needs.select.outputs.performance-artifact-id }}
          PERFORMANCE_REPORT: performance/release-candidate-performance.json
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-candidate.mjs verify qualification/release-candidate.json
      - name: Recheck the tag and candidate bytes
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/prepare-stable-candidate-tag.mjs --verify-remote
          node scripts/verify-canonical-release-artifact.mjs canonical-release
      - name: Publish or verify the release tag
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/push-stable-release-tag.mjs
      - name: Prepare the local release tag
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs
      - name: Publish or verify the GitHub release
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          GITHUB_IMMUTABLE_RELEASES_EXPECTED: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/publish-github-stable-release.mjs canonical-release
      - name: Recheck the public release tag
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs --require-remote

  open-vsx:
    name: Publish the GitHub release to Open VSX
    needs: publish
    uses: ./.github/workflows/open-vsx-promotion.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ inputs.release_tag }}
