name: Stable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable tag matching package.json, for example v1.0.0
        required: true
        type: string
      publish:
        description: Publish to GitHub and Open VSX and trigger Marketplace promotion
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stable-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.canonical_artifact.outputs.artifact-id }}
    steps:
      - name: Require protected main source
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$EVENT_REF_TYPE" = "branch"
          test "$EVENT_REF" = "refs/heads/main"
          case "$EXPECTED_SHA" in *[!0-9a-f]*|"") exit 1 ;; esac
          test "${#EXPECTED_SHA}" -eq 40
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact protected main commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-parse --verify refs/remotes/origin/main^{commit})" = "$EXPECTED_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Require the remote release tag to be absent or exact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs --verify-remote
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - id: release_metadata
        name: Validate stable release metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-metadata.mjs
      - name: Reject preview metadata
        if: ${{ steps.release_metadata.outputs.prerelease != 'false' }}
        run: exit 1
      - name: Prepare exact local release tag
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: python -m pip install --no-deps "https://files.pythonhosted.org/packages/90/b0/114463d056b6b328d45557001e848b8ab15539bd8f4fa7a457ccb83e2b5d/uv-0.11.32-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=3da76cd4e2697de30928b8a8524bd39183ac1e08cb7e72833807c022b7cba6c4"
      - run: npm run lock:remote-jupyter:check
      - name: Package the ordinary stable VSIX once
        run: npm run package -- --out openwrangler.candidate.vsix
      - run: npm run verify:vsix -- openwrangler.candidate.vsix
      - name: Publish the canonical stable artifact set
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/create-canonical-release-artifact.mjs
          openwrangler.candidate.vsix
          --out-dir canonical-release
      - id: canonical
        name: Revalidate the canonical stable artifact set
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: canonical_artifact
        name: Upload the canonical stable artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrangler-stable-release
          path: |
            canonical-release/openwrangler.vsix
            canonical-release/openwrangler.vsix.sha256
            canonical-release/openwrangler.vsix.provenance.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          include-hidden-files: false

  cross-platform:
    name: Cross-platform native acceptance (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: canonical-release
          merge-multiple: true
      - id: canonical
        name: Verify the exact canonical stable artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - run: npm run verify:vsix -- canonical-release/openwrangler.vsix
      - run: npm run test:python-environment-smoke
      - run: python -m pytest python/tests -q
      - run: npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: stable
      - run: npm run build:test-extension
      - id: canonical_vscode
        name: Reverify the exact canonical stable artifact for cross-platform VS Code
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: packaged_editor
        name: Test packaged VS Code
        run: node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          VSCODE_TEST_VERSION: stable
      - name: Upload VS Code failure diagnostics
        if: ${{ always() && steps.packaged_editor.outcome == 'failure' && steps.packaged_editor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: canonical_cursor
        name: Reverify the exact canonical stable artifact for cross-platform Cursor
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: cursor_smoke
        name: Test pinned Cursor platform smoke
        run: node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: cursor
          OPEN_WRANGLER_PACKAGED_MODE: platform-smoke
      - name: Upload Cursor failure diagnostics
        if: ${{ always() && steps.cursor_smoke.outcome == 'failure' && steps.cursor_smoke.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-cursor-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.cursor_smoke.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  linux-acceptance:
    name: Linux release acceptance
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: python -m pip install "pandas>=2.2,<3.0" "pyspark[connect]==4.2.0"
      - name: Verify exact coverage runtimes
        run: |
          python - <<'PY'
          import pandas
          import pyspark
          from packaging.version import Version

          assert pyspark.__version__ == "4.2.0", pyspark.__version__
          assert Version("2.2") <= Version(pandas.__version__) < Version("3"), pandas.__version__
          PY
          java -XshowSettings:properties -version 2>&1 |
            grep -Eq '^[[:space:]]*java\.specification\.version = 17$'
      - run: python -m pip install --no-deps "https://files.pythonhosted.org/packages/90/b0/114463d056b6b328d45557001e848b8ab15539bd8f4fa7a457ccb83e2b5d/uv-0.11.32-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=3da76cd4e2697de30928b8a8524bd39183ac1e08cb7e72833807c022b7cba6c4"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: canonical-release
          merge-multiple: true
      - id: canonical
        name: Verify the exact canonical stable artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - run: npm run verify:vsix -- canonical-release/openwrangler.vsix
      - run: npm run check
      - run: npm test
      - run: npm run test:webview-acceptance
      - name: Upload webview failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-webview-${{ github.run_attempt }}
          path: |
            tmp/screenshots-actual/
            tmp/screenshots-diff/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - run: npm run test:coverage
      - run: npm audit --omit=dev
      - run: npm run audit:python
      - run: npm run benchmark:runtime
      - run: npm run build:test-extension
      - id: canonical_vscode
        name: Reverify the exact canonical stable artifact for VS Code
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: packaged_vscode
        name: Test the full package in headless VS Code
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          VSCODE_TEST_VERSION: stable
      - name: Upload VS Code failure diagnostics
        if: ${{ always() && steps.packaged_vscode.outcome == 'failure' && steps.packaged_vscode.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_vscode.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: prepare_cursor_xvfb
        name: Prepare pinned private Xvfb for Cursor
        shell: node {0}
        run: |
          const { execFileSync } = require("node:child_process");
          const { X_OK } = require("node:constants");
          const { accessSync, appendFileSync, lstatSync } = require("node:fs");
          const { isAbsolute } = require("node:path");

          const output = execFileSync(process.execPath, ["scripts/prepare-xvfb.mjs", "--print-path"], {
            cwd: process.cwd(),
            encoding: "utf8",
            stdio: ["ignore", "pipe", "inherit"]
          });
          if (!/^[^\0\r\n]+\n?$/u.test(output)) {
            throw new Error("The Xvfb preparer must print exactly one path.");
          }
          const executable = output.endsWith("\n") ? output.slice(0, -1) : output;
          if (!isAbsolute(executable)) throw new Error("The prepared Xvfb path must be absolute.");
          const stat = lstatSync(executable);
          if (!stat.isFile() || stat.isSymbolicLink()) {
            throw new Error("The prepared Xvfb path must be a regular, non-symlink file.");
          }
          accessSync(executable, X_OK);
          appendFileSync(process.env.GITHUB_OUTPUT, `executable=${executable}\n`, "utf8");
      - id: canonical_cursor
        name: Reverify the exact canonical stable artifact for Cursor
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: packaged_cursor
        name: Test the full package in private-display Cursor
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_cursor_xvfb.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload Cursor failure diagnostics
        if: ${{ always() && steps.packaged_cursor.outcome == 'failure' && steps.packaged_cursor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-cursor-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_cursor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  installed-performance:
    name: Installed performance in pinned VS Code and Cursor
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - name: Prepare exact local release tag
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: canonical-release
          merge-multiple: true
      - id: canonical
        name: Verify the exact canonical stable artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: installed_performance
        name: Test the ordinary stable artifact in pinned editors
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          /usr/bin/dbus-run-session -- npm run benchmark:installed --
          --pinned-editors
          --candidate-in canonical-release/openwrangler.vsix
          --candidate-checksum canonical-release/openwrangler.vsix.sha256
          --candidate-provenance canonical-release/openwrangler.vsix.provenance.json
          --out ${{ runner.temp }}/openwrangler-installed-performance-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Upload failed numeric installed-performance evidence
        if: ${{ always() && steps.installed_performance.outcome == 'failure' && steps.installed_performance.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-installed-performance-numeric-failure
          path: ${{ steps.installed_performance.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Upload installed-performance evidence
        if: ${{ steps.installed_performance.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-installed-performance
          path: ${{ runner.temp }}/openwrangler-installed-performance-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
          include-hidden-files: false

  released-jupyter:
    name: Released and remote Jupyter acceptance
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: python -m pip install --no-deps "https://files.pythonhosted.org/packages/90/b0/114463d056b6b328d45557001e848b8ab15539bd8f4fa7a457ccb83e2b5d/uv-0.11.32-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=3da76cd4e2697de30928b8a8524bd39183ac1e08cb7e72833807c022b7cba6c4"
      - run: npm run lock:remote-jupyter:check
      - run: npm run audit:remote-jupyter
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: canonical-release
          merge-multiple: true
      - id: canonical
        name: Verify the exact canonical stable artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - run: npm run verify:vsix -- canonical-release/openwrangler.vsix
      - run: npm run build:test-extension
      - id: prepare_xvfb
        name: Prepare pinned private Xvfb
        shell: node {0}
        run: |
          const { execFileSync } = require("node:child_process");
          const { X_OK } = require("node:constants");
          const { accessSync, appendFileSync, lstatSync } = require("node:fs");
          const { isAbsolute } = require("node:path");

          const output = execFileSync(process.execPath, ["scripts/prepare-xvfb.mjs", "--print-path"], {
            cwd: process.cwd(),
            encoding: "utf8",
            stdio: ["ignore", "pipe", "inherit"]
          });
          if (!/^[^\0\r\n]+\n?$/u.test(output)) {
            throw new Error("The Xvfb preparer must print exactly one path.");
          }
          const executable = output.endsWith("\n") ? output.slice(0, -1) : output;
          if (!isAbsolute(executable)) throw new Error("The prepared Xvfb path must be absolute.");
          const stat = lstatSync(executable);
          if (!stat.isFile() || stat.isSymbolicLink()) {
            throw new Error("The prepared Xvfb path must be a regular, non-symlink file.");
          }
          accessSync(executable, X_OK);
          appendFileSync(process.env.GITHUB_OUTPUT, `executable=${executable}\n`, "utf8");
      - id: canonical_jupyter
        name: Reverify the exact canonical stable artifact for released Jupyter
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: packaged_editor
        name: Test released Jupyter in the exact packaged VSIX
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode,cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "1"
          VSCODE_TEST_VERSION: stable
      - name: Upload released-Jupyter failure diagnostics
        if: ${{ always() && steps.packaged_editor.outcome == 'failure' && steps.packaged_editor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-jupyter-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  remote-ssh:
    name: Remote SSH acceptance
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Prepare namespace-capable acceptance host
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap \
            busybox-static \
            coreutils \
            iproute2 \
            libtomcrypt1 \
            libtommath1 \
            openssh-client \
            procps \
            python3-venv \
            x11-xkb-utils
          system_runtime_roots=(
            /usr/share/fontconfig
            /usr/share/fonts
            /usr/share/glib-2.0
            /usr/share/icons
            /usr/share/mime
            /usr/share/X11
            /usr/share/zoneinfo
          )
          test ! -L /usr/share
          test "$(realpath /usr/share)" = "/usr/share"
          test "$(stat --format='%u' /usr/share)" = "0"
          sudo chmod go-w -- /usr/share
          test ! -w /usr/share
          for directory in "${system_runtime_roots[@]}"; do
            test ! -L "$directory"
            test "$(realpath "$directory")" = "$directory"
            test "$(stat --format='%u' "$directory")" = "0"
          done
          sudo chmod --recursive go-w -- "${system_runtime_roots[@]}"
          for directory in "${system_runtime_roots[@]}"; do
            test ! -L "$directory"
            test "$(realpath "$directory")" = "$directory"
            test "$(stat --format='%u' "$directory")" = "0"
            unsafe_owner="$(find "$directory" -xdev ! -user root -print -quit)"
            unsafe_mode="$(find "$directory" -xdev \( -type d -o -type f \) -perm /022 -print -quit)"
            unsafe_type="$(find "$directory" -xdev ! -type d ! -type f ! -type l -print -quit)"
            test -z "$unsafe_owner"
            test -z "$unsafe_mode"
            test -z "$unsafe_type"
          done
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          test "$(sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = "0"
          test "$(sysctl --values kernel.unprivileged_userns_clone)" = "1"
          test "$(sysctl --values user.max_user_namespaces)" -gt 0
      - run: npm ci
      - run: /usr/bin/python3 -m venv .remote-venv
      - run: .remote-venv/bin/python -m pip install --upgrade pip
      - run: .remote-venv/bin/python -m pip install ./python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: canonical-release
          merge-multiple: true
      - id: canonical
        name: Verify the exact canonical stable artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - run: npm run verify:vsix -- canonical-release/openwrangler.vsix
      - id: canonical_remote
        name: Reverify the exact canonical stable artifact for Remote SSH
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: remote_workspace
        name: Test packaged VS Code over Remote SSH
        run: >-
          npm run test:remote-workspace --
          ${{ steps.canonical_remote.outputs.candidate_path }}
          ${{ steps.canonical_remote.outputs.candidate_sha256 }}
          ${{ steps.canonical_remote.outputs.candidate_bytes }}
        env:
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_REMOTE_PYTHON: ${{ github.workspace }}/.remote-venv/bin/python
      # The Remote SSH runner intentionally exposes no artifact path yet. Uploading its private
      # workspace or raw output would violate the sealed, receipt-bound evidence contract.

  acceptance-gate:
    name: Require every stable acceptance result
    needs: [package, cross-platform, linux-acceptance, installed-performance, released-jupyter, remote-ssh]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed unless every required job succeeded
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          CROSS_PLATFORM_RESULT: ${{ needs.cross-platform.result }}
          LINUX_ACCEPTANCE_RESULT: ${{ needs.linux-acceptance.result }}
          INSTALLED_PERFORMANCE_RESULT: ${{ needs.installed-performance.result }}
          RELEASED_JUPYTER_RESULT: ${{ needs.released-jupyter.result }}
          REMOTE_SSH_RESULT: ${{ needs.remote-ssh.result }}
        run: |
          test "$PACKAGE_RESULT" = "success"
          test "$CROSS_PLATFORM_RESULT" = "success"
          test "$LINUX_ACCEPTANCE_RESULT" = "success"
          test "$INSTALLED_PERFORMANCE_RESULT" = "success"
          test "$RELEASED_JUPYTER_RESULT" = "success"
          test "$REMOTE_SSH_RESULT" = "success"

  release:
    name: Publish GitHub/Open VSX and trigger Marketplace
    needs: [package, acceptance-gate]
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: canonical-release
          merge-multiple: true
      - id: canonical
        name: Revalidate the exact artifact before release
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - run: npm run verify:vsix -- canonical-release/openwrangler.vsix
      - name: Recheck that the remote release tag is absent or exact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs --verify-remote
      - id: canonical_release
        name: Reverify the exact canonical artifact for final publication
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - name: Publish or verify the exact lightweight release tag
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/push-stable-release-tag.mjs
      - name: Publish or verify the exact GitHub stable release
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/publish-github-stable-release.mjs canonical-release
      - name: Verify the Open VSX publisher token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx verify-pat Matt17BR
      - id: canonical_open_vsx_preflight
        name: Reverify the exact canonical artifact before Open VSX preflight
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - name: Reject a conflicting existing Open VSX version
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-open-vsx-release.mjs canonical-release --preflight
      - id: canonical_open_vsx_publish
        name: Reverify the exact canonical artifact before Open VSX publication
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - name: Publish the exact stable VSIX to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx publish --skip-duplicate canonical-release/openwrangler.vsix
      - name: Verify the exact public Open VSX release
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-open-vsx-release.mjs canonical-release --verify
