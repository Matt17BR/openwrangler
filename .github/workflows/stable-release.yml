name: Stable release promotion

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful first-attempt release-candidate workflow run ID
        required: true
        type: string
      release_tag:
        description: Stable tag built by that candidate, for example v2.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-train-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  select:
    name: Select the successful candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      candidate-artifact-id: ${{ steps.candidate.outputs.candidate_artifact_id }}
      candidate-run-id: ${{ steps.candidate.outputs.candidate_run_id }}
      candidate-source-sha: ${{ steps.candidate.outputs.source_sha }}
    steps:
      - name: Require a first-attempt dispatch from protected main
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$EVENT_REF_TYPE" = "branch"
          test "$EVENT_REF" = "refs/heads/main"
          test "$RUN_ATTEMPT" = "1"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - id: candidate
        name: Select one successful candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-candidate.mjs select
      - name: Require the candidate source to remain on protected main
        env:
          CANDIDATE_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          CURRENT_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$CURRENT_MAIN_SHA"
          git cat-file -e "$CANDIDATE_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SOURCE_SHA" "$CURRENT_MAIN_SHA"

  promote:
    name: Promote the exact candidate bytes
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    environment: publishing
    concurrency:
      group: openwrangler-release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the historical candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.select.outputs.candidate-source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require the exact historical candidate source
        env:
          CANDIDATE_SOURCE_SHA: ${{ needs.select.outputs.candidate-source-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$CANDIDATE_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - id: release_metadata
        name: Validate the historical stable metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-metadata.mjs
      - name: Require stable metadata
        if: ${{ steps.release_metadata.outputs.prerelease != 'false' }}
        run: exit 1
      - name: Download the exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.select.outputs.candidate-artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.select.outputs.candidate-run-id }}
          path: canonical-release
          merge-multiple: true
      - name: Verify the exact candidate artifact
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - name: Recheck that the remote release tag is absent or exact
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs --verify-remote
      - id: canonical_release
        name: Reverify the exact candidate bytes before publication
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - name: Publish or verify the exact lightweight release tag
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/push-stable-release-tag.mjs
      - name: Prepare the exact local release tag for registry verification
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs
      - name: Publish or verify the exact GitHub stable release
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          GITHUB_IMMUTABLE_RELEASES_EXPECTED: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/publish-github-stable-release.mjs canonical-release
      - name: Verify the Open VSX publisher token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          test -n "${OVSX_PAT:-}"
          output="$(npx --no-install ovsx verify-pat Matt17BR 2>&1)"
          printf '%s\n' "$output"
          grep -Fq "PAT valid to publish at Matt17BR" <<< "$output"
      - name: Reject a conflicting Open VSX stable release
        env:
          AUTOMATION_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          RELEASE_PRERELEASE: "false"
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-open-vsx-github-release.mjs canonical-release --preflight
      - name: Reverify the candidate before Open VSX publication
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - name: Publish the exact candidate VSIX to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          RELEASE_PRERELEASE: "false"
          RELEASE_VERSION: ${{ steps.canonical_release.outputs.extension_version }}
        run: |
          set -euo pipefail
          test -n "${OVSX_PAT:-}"
          test "$RELEASE_PRERELEASE" = "false"
          output="$(npx --no-install ovsx publish --skip-duplicate canonical-release/openwrangler.vsix 2>&1)"
          printf '%s\n' "$output"
          published="Published Matt17BR.openwrangler v$RELEASE_VERSION"
          duplicate="Extension Matt17BR.openwrangler $RELEASE_VERSION is already published. Skipping publish."
          grep -Fq "$published" <<< "$output" || grep -Fq "$duplicate" <<< "$output"
      - name: Verify the exact public Open VSX stable release
        env:
          AUTOMATION_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          RELEASE_PRERELEASE: "false"
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-open-vsx-github-release.mjs canonical-release --verify
      - name: Recheck the immutable public stable tag
        env:
          EXPECTED_SHA: ${{ needs.select.outputs.candidate-source-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs --require-remote
