name: Release candidate
run-name: Release candidate ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable tag matching the protected-main package, for example v2.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-train-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Package and accept the immutable candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Require first-attempt protected main
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EXPECTED_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$EVENT_REF_TYPE" = "branch"
          test "$EVENT_REF" = "refs/heads/main"
          test "$RUN_ATTEMPT" = "1"
          case "$EXPECTED_SHA" in *[!0-9a-f]*|"") exit 1 ;; esac
          test "${#EXPECTED_SHA}" -eq 40
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - id: release_metadata
        name: Validate stable release metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-metadata.mjs
      - name: Require stable metadata
        if: ${{ steps.release_metadata.outputs.prerelease != 'false' }}
        run: exit 1
      - name: Require the exact protected-main source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-parse --verify refs/remotes/origin/main^{commit})" = "$EXPECTED_SHA"
      - name: Require the remote release tag to be absent or exact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs --verify-remote
      - run: npm ci --ignore-scripts
      - name: Prepare the local candidate tag without publishing it
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs
      - name: Package the release candidate exactly once
        run: npm run clean && npm run build && npm run package:prepared -- --out openwrangler.candidate.vsix
      - run: npm run verify:vsix -- openwrangler.candidate.vsix
      - name: Create the canonical candidate artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node scripts/create-canonical-release-artifact.mjs
          openwrangler.candidate.vsix
          --out-dir canonical-release
      - name: Verify the canonical candidate artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: inspection_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "python[dev]"
      - name: Audit published dependencies
        run: |
          npm run audit:node
          npm run audit:python
          optional_runtime_requirements="$(
            mktemp "${RUNNER_TEMP}/openwrangler-optional-runtime-audit.XXXXXX"
          )"
          python -c 'from scripts.python_runtime_dependency_authority import load_authority; print(*(spec for dependency in load_authority() if dependency.pyproject_group == "dev" for spec in dependency.pyproject_install_specs), sep=chr(10))' \
            > "$optional_runtime_requirements"
          python -m pip_audit \
            --requirement "$optional_runtime_requirements" \
            --strict \
            --progress-spinner off
      - name: Test the exact candidate artifact in pinned VS Code
        env:
          EXPECTED_SHA: ${{ github.sha }}
          OPEN_WRANGLER_REMOTE_INSPECTION_PYTHON: ${{ steps.inspection_python.outputs.python-path }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          npm run benchmark:installed --
          --pinned-editors
          --editors vscode
          --candidate-in canonical-release/openwrangler.vsix
          --candidate-checksum canonical-release/openwrangler.vsix.sha256
          --candidate-provenance canonical-release/openwrangler.vsix.provenance.json
          --out ${{ runner.temp }}/release-candidate-performance.json
      - name: Reverify the candidate for pinned Cursor
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: cursor_platform_smoke
        name: Test the exact candidate artifact in pinned Cursor
        env:
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_PACKAGED_EDITORS: cursor
          OPEN_WRANGLER_PACKAGED_MODE: platform-smoke
        run: |
          set -euo pipefail
          export OPEN_WRANGLER_XVFB_EXECUTABLE
          OPEN_WRANGLER_XVFB_EXECUTABLE="$(node scripts/prepare-xvfb.mjs --print-path)"
          /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs \
            canonical-release/openwrangler.vsix
      - name: Upload pinned Cursor failure diagnostics
        if: ${{ !cancelled() && steps.cursor_platform_smoke.outcome == 'failure' && steps.cursor_platform_smoke.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-candidate-diagnostics-cursor-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.cursor_platform_smoke.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Reverify the accepted canonical candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - name: Upload the immutable candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrangler-release-candidate
          path: |
            canonical-release/openwrangler.vsix
            canonical-release/openwrangler.vsix.sha256
            canonical-release/openwrangler.vsix.provenance.json
          if-no-files-found: error
          retention-days: 21
          compression-level: 0
          include-hidden-files: false

  r-notebook:
    name: Qualify the R notebook candidate (${{ matrix.os }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwrangler-release-candidate
          path: canonical-release
      - name: Verify the supplied canonical R candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - name: Install system ZeroMQ for IRkernel
        if: ${{ runner.os == 'macOS' }}
        run: brew install zeromq
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      - id: rscript
        name: Locate hosted Rscript
        shell: Rscript {0}
        run: |
          version <- as.character(getRversion())
          if (!identical(version, "4.5.2")) stop("Expected hosted R 4.5.2, got ", version, ".")
          name <- if (.Platform$OS.type == "windows") "Rscript.exe" else "Rscript"
          executable <- normalizePath(file.path(R.home("bin"), name), winslash = "/", mustWork = TRUE)
          if (!nzchar(executable) || grepl("[\r\n]", executable)) stop("Rscript resolved to an unsafe path.")
          output <- Sys.getenv("GITHUB_OUTPUT")
          if (!nzchar(output)) stop("GITHUB_OUTPUT is not available.")
          cat(sprintf("executable=%s\nversion=%s\n", executable, version), file = output, append = TRUE)
          cat(sprintf("Hosted R: %s\n", version))
      - run: python -m pip install jupyter-client
      - run: npm run build:test-extension
      - id: r_notebook
        name: Test the exact candidate in local R Jupyter
        shell: bash
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export OPEN_WRANGLER_EDITOR_DISPLAY=xvfb
            export OPEN_WRANGLER_XVFB_EXECUTABLE
            OPEN_WRANGLER_XVFB_EXECUTABLE="$(node scripts/prepare-xvfb.mjs --print-path)"
            /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
          else
            node scripts/run-packaged-editor-tests.mjs canonical-release/openwrangler.vsix
          fi
      - name: Upload R notebook candidate failure diagnostics
        if: ${{ !cancelled() && steps.r_notebook.outcome == 'failure' && steps.r_notebook.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-candidate-diagnostics-r-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.r_notebook.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Reverify the R-qualified canonical candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
