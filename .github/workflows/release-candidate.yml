name: Release candidate
run-name: Release candidate ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable tag matching the current main branch, for example v2.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.release_tag }}
  cancel-in-progress: false
  queue: max

jobs:
  package:
    name: Build the candidate once
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.candidate_artifact.outputs.artifact-id }}
      candidate-bytes: ${{ steps.canonical.outputs.candidate_bytes }}
      candidate-sha256: ${{ steps.canonical.outputs.candidate_sha256 }}
    steps:
      - name: Require the current main branch
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$EVENT_REF_TYPE" = "branch"
          test "$EVENT_REF" = "refs/heads/main"
          case "$EXPECTED_SHA" in *[!0-9a-f]*|"") exit 1 ;; esac
          test "${#EXPECTED_SHA}" -eq 40
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - id: release_metadata
        name: Validate the release tag and version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-metadata.mjs
      - name: Require stable release metadata
        if: ${{ steps.release_metadata.outputs.prerelease != 'false' }}
        run: exit 1
      - name: Require the exact source and available tag
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-parse --verify refs/remotes/origin/main^{commit})" = "$EXPECTED_SHA"
          node scripts/prepare-stable-candidate-tag.mjs --verify-remote
      - run: npm ci --ignore-scripts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - name: Check release metadata and packaging rules
        run: npm run check:invariants
      - name: Check public release media
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: >-
          node scripts/verify-public-media-surfaces.mjs
          --source-sha "$RELEASE_SOURCE_SHA"
          --version "$RELEASE_VERSION"
          --prepublish
      - name: Prepare the local release tag
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-stable-candidate-tag.mjs
      - name: Build the production VSIX once
        run: npm run clean && npm run build && npm run package:prepared -- --out openwrangler.candidate.vsix
      - name: Verify and seal the candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          npm run verify:vsix -- openwrangler.candidate.vsix
          node scripts/create-canonical-release-artifact.mjs openwrangler.candidate.vsix --out-dir canonical-release
      - id: canonical
        name: Record the exact candidate bytes
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-canonical-release-artifact.mjs canonical-release
      - id: candidate_artifact
        name: Upload the candidate VSIX, checksum, and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrangler-release-candidate-${{ github.run_attempt }}
          path: |
            canonical-release/openwrangler.vsix
            canonical-release/openwrangler.vsix.sha256
            canonical-release/openwrangler.vsix.provenance.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: false

  candidate-acceptance:
    name: Installed acceptance
    needs: package
    uses: ./.github/workflows/candidate-acceptance.yml
    permissions:
      contents: read
    with:
      artifact_id: ${{ needs.package.outputs.artifact-id }}
      expected_sha: ${{ github.sha }}
      release_tag: ${{ inputs.release_tag }}

  remote-ssh:
    name: Remote SSH acceptance
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Prepare the Remote SSH runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap busybox-static coreutils iproute2 libtomcrypt1 libtommath1 \
            openssh-client procps python3-venv x11-xkb-utils
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          test "$(sysctl --values user.max_user_namespaces)" -gt 0
      - run: npm ci --ignore-scripts
      - run: /usr/bin/python3 -m venv .remote-venv
      - run: .remote-venv/bin/python -m pip install --upgrade pip
      - run: .remote-venv/bin/python -m pip install ./python
      - run: npm run build:test-extension
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: canonical-release
          merge-multiple: true
      - name: Verify and test the exact VSIX over Remote SSH
        env:
          EXPECTED_SHA: ${{ github.sha }}
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_REMOTE_INSPECTION_PYTHON: ${{ github.workspace }}/.remote-venv/bin/python
          OPEN_WRANGLER_REMOTE_PYTHON: ${{ github.workspace }}/.remote-venv/bin/python
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/verify-canonical-release-artifact.mjs canonical-release
          node scripts/run-remote-workspace-smoke.mjs \
            canonical-release/openwrangler.vsix \
            "${{ needs.package.outputs.candidate-sha256 }}" \
            "${{ needs.package.outputs.candidate-bytes }}"

  qualify:
    name: Record candidate qualification
    if: ${{ always() }}
    needs: [package, candidate-acceptance, remote-ssh]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every candidate check
        env:
          ACCEPTANCE_RESULT: ${{ needs.candidate-acceptance.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          REMOTE_RESULT: ${{ needs.remote-ssh.result }}
        run: |
          set -euo pipefail
          test "$PACKAGE_RESULT" = "success"
          test "$ACCEPTANCE_RESULT" = "success"
          test "$REMOTE_RESULT" = "success"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: canonical-release
          merge-multiple: true
      - name: Write the qualification receipt
        env:
          CANDIDATE_ACCEPTANCE_RESULT: ${{ needs.candidate-acceptance.result }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
          CANDIDATE_BYTES: ${{ needs.package.outputs.candidate-bytes }}
          CANDIDATE_SHA256: ${{ needs.package.outputs.candidate-sha256 }}
          EXPECTED_SHA: ${{ github.sha }}
          PERFORMANCE_ARTIFACT_ID: ${{ needs.candidate-acceptance.outputs.performance_artifact_id }}
          PERFORMANCE_BYTES: ${{ needs.candidate-acceptance.outputs.performance_bytes }}
          PERFORMANCE_SHA256: ${{ needs.candidate-acceptance.outputs.performance_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REMOTE_SSH_RESULT: ${{ needs.remote-ssh.result }}
        run: |
          set -euo pipefail
          node scripts/verify-canonical-release-artifact.mjs canonical-release
          mkdir -m 0700 qualification
          node scripts/release-candidate.mjs create qualification/release-candidate.json
      - name: Upload the qualification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrangler-release-candidate-qualification-${{ github.run_attempt }}
          path: qualification/release-candidate.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: false
