# TEMPORARY dispatch-only replacement on an owned branch. Do not merge this workflow.
name: Public Lowercase control discovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Existing tooling and isolated native dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          python -m venv "$RUNNER_TEMP/discovery-venv"
          "$RUNNER_TEMP/discovery-venv/bin/python" -m pip install 'pandas==2.3.3' 'polars==1.44.1' 'numpy==2.5.1' 'pyarrow==25.0.1' 'ipykernel==6.30.1'
      - name: Immutable Open Wrangler comparison target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/stable-comparison-target"
          gh release download v2.4.0 --repo Matt17BR/openwrangler --pattern 'openwrangler.vsix' --pattern 'openwrangler.vsix.provenance.json' --pattern 'openwrangler.vsix.sha256' --dir "$RUNNER_TEMP/stable-comparison-target"
          git fetch --no-tags origin b1ccf7d67c979741adfeab2ecc6a28aa8665089f
      - name: One capped hosted public UI discovery
        shell: bash
        run: |
          node scripts/temporary-everyday-discovery/launch.mjs --repo "$GITHUB_WORKSPACE" --artifact "$RUNNER_TEMP/stable-comparison-target" --python "$RUNNER_TEMP/discovery-venv/bin/python" --out "$RUNNER_TEMP/everyday-discovery-result"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: everyday-public-discovery
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/everyday-discovery-result/launcher.json
            ${{ runner.temp }}/everyday-discovery-result/discovery.json
            ${{ runner.temp }}/everyday-discovery-result/synthetic-page.png
            ${{ runner.temp }}/everyday-discovery-result/export.py
