name: Performance gates

on:
  workflow_dispatch:
    inputs:
      pyspark_profile:
        description: Run the 1M-row PySpark profiling measurement
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  polars-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: python python/benchmarks/runtime_performance.py --strict --json-out performance.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: polars-runtime-performance
          path: performance.json

  pyspark-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.pyspark_profile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: python -m pip install "pandas>=2.2,<3.0" "pyspark[connect]==4.2.0"
      - run: python python/benchmarks/pyspark_profile.py --json-out pyspark-profile.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: pyspark-profile
          path: pyspark-profile.json
          retention-days: 14
