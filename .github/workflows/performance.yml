name: Performance gates

on:
  workflow_dispatch:
    inputs:
      comparison_mode:
        description: Isolated public UI experiment (ordinary gates remain the default)
        required: false
        type: choice
        default: none
        options: [none, pilot, study]
      comparison_pilot_run:
        description: Reviewed successful pilot run ID (required only for study)
        required: false
        type: string
      pyspark_profile:
        description: Run the 1M-row PySpark profiling measurement
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  polars-runtime:
    if: github.event_name != 'workflow_dispatch' || !inputs.comparison_mode || inputs.comparison_mode == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e python
      - run: python python/benchmarks/runtime_performance.py --strict --json-out performance.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: polars-runtime-performance
          path: performance.json

  pyspark-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.pyspark_profile && (!inputs.comparison_mode || inputs.comparison_mode == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: python -m pip install "pandas>=2.2,<3.0" "pyspark[connect]==4.2.0"
      - run: python python/benchmarks/pyspark_profile.py --json-out pyspark-profile.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: pyspark-profile
          path: pyspark-profile.json
          retention-days: 14

  public-comparison:
    if: github.event_name == 'workflow_dispatch' && (inputs.comparison_mode == 'pilot' || inputs.comparison_mode == 'study')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    concurrency:
      group: public-comparison-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require one original isolated dispatch
        env:
          ATTEMPT: ${{ github.run_attempt }}
          PILOT_RUN: ${{ inputs.comparison_pilot_run }}
          MODE: ${{ inputs.comparison_mode }}
        run: |
          set -euo pipefail
          test "$ATTEMPT" = 1
          if [[ "$MODE" == study ]]; then [[ "$PILOT_RUN" =~ ^[0-9]+$ ]]; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.14
      - run: npm ci --ignore-scripts
      - name: Prepare identical locked notebook dependencies
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/comparison-python"
          "$RUNNER_TEMP/comparison-python/bin/python" -m pip install --require-hashes -r scripts/remote-jupyter/requirements.txt
          "$RUNNER_TEMP/comparison-python/bin/python" -m pip install --no-deps 'https://files.pythonhosted.org/packages/60/c9/711ca85d79f1ec98f29a5eae2b051e25b4ecec5de3e3c0e2d5c5dcb15664/pyarrow-25.0.1-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=5389cdf79447ed1515c9e31620e6e1e2302249564d603f2ad727d4f6d313e4c3'
      - name: Download the public immutable 2.4.0 triple
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/comparison-artifact"
          gh release download v2.4.0 --repo Matt17BR/openwrangler --dir "$RUNNER_TEMP/comparison-artifact" --pattern openwrangler.vsix --pattern openwrangler.vsix.sha256 --pattern openwrangler.vsix.provenance.json
      - name: Require the reviewed pilot to be this exact experiment source
        if: inputs.comparison_mode == 'study'
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_RUN: ${{ inputs.comparison_pilot_run }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PILOT_RUN" > "$RUNNER_TEMP/comparison-pilot-run.json"
          node -e 'const r=require(process.env.RUNNER_TEMP+"/comparison-pilot-run.json"); if(r.conclusion!=="success" || r.head_sha!==process.env.EXPECTED_SHA || r.event!=="workflow_dispatch" || r.run_attempt!==1 || r.workflow_id!==313455337) throw Error("Pilot provenance mismatch")'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.comparison_mode == 'study'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.comparison_pilot_run }}
          name: public-comparison-pilot-${{ inputs.comparison_pilot_run }}
          path: ${{ runner.temp }}/comparison-pilot
      - name: Run all four pilot cells or the frozen paired study
        env:
          MODE: ${{ inputs.comparison_mode }}
        run: |
          set -euo pipefail
          export OPEN_WRANGLER_XVFB_EXECUTABLE="$(node scripts/prepare-xvfb.mjs --print-path)"
          args=()
          if [[ "$MODE" == study ]]; then
            node -e 'const r=require(process.env.RUNNER_TEMP+"/comparison-pilot/report.json"); if(r.mode!=="pilot" || !r.cleanupVerified || !r.dependenciesUnchanged || !r.pairedSourceDigestsEqual || r.sessions.length!==4 || r.sessions.some(s=>s.status!=="passed")) throw Error("Incomplete pilot")'
            args+=(--freeze "$RUNNER_TEMP/comparison-pilot/pilot-freeze.json")
          fi
          /usr/bin/dbus-run-session -- node .github/experiments/current-public-comparison/launcher.mjs --repo "$GITHUB_WORKSPACE" --artifact "$RUNNER_TEMP/comparison-artifact" --python "$RUNNER_TEMP/comparison-python/bin/python" --out "$RUNNER_TEMP/comparison-results" --mode "$MODE" "${args[@]}"
      - name: Retain only the small owned measurement sources
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/comparison-results/sources"
          cp .github/experiments/current-public-comparison/{launcher.mjs,driver.cjs,fixture.py} "$RUNNER_TEMP/comparison-results/sources/"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: public-comparison-${{ inputs.comparison_mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/comparison-results/
          if-no-files-found: error
          retention-days: 14
