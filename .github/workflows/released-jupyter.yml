name: Released Jupyter acceptance

on:
  workflow_dispatch:
    inputs:
      target:
        description: Acceptance lane to run
        required: true
        default: linux-all
        type: choice
        options:
          - linux-all
          - linux-python
          - linux-r
          - macos-r
          - windows-r
  workflow_call:
    inputs:
      target:
        description: Acceptance lane to run
        required: true
        type: string
      omit_editor:
        description: Omit platform editor journeys for proven R source-test edits
        type: boolean
        default: false
      omit_source:
        description: Omit native numeric and CSV source checks for proven selected host and renderer edits
        type: boolean
        default: false
    outputs:
      macos_result:
        description: Result of selected macOS R source, package and editor checks
        value: ${{ jobs.macos-r.result }}
      windows_result:
        description: Result of selected Windows R source, package and editor checks
        value: ${{ jobs.windows-r.result }}

permissions:
  contents: read

concurrency:
  group: released-jupyter-${{ github.event_name }}-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  vscode:
    name: ${{ inputs.target == 'linux-python' && 'Local Python notebooks and files in VS Code; Spark, remote and R omitted' || inputs.target == 'linux-r' && 'R investigation in VS Code and Cursor; Python/file-input checks omitted' || 'Released Jupyter in VS Code and Cursor' }}
    if: ${{ inputs.target == 'linux-all' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'linux-python' || inputs.target == 'linux-r')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target != 'linux-python' }}
        with:
          distribution: temurin
          java-version: "17"
          verify-signature: true
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: ${{ inputs.target == 'linux-all' || (github.event_name == 'workflow_dispatch' && inputs.target == 'linux-r') }}
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - id: rscript
        name: Locate hosted Rscript
        if: ${{ inputs.target == 'linux-all' || (github.event_name == 'workflow_dispatch' && inputs.target == 'linux-r') }}
        shell: bash
        run: |
          set -euo pipefail
          rscript="$(command -v Rscript)"
          if [[ "$rscript" != /* || ! -x "$rscript" ]]; then
            echo "Rscript did not resolve to an absolute executable." >&2
            exit 1
          fi
          r_version="$(Rscript --vanilla -e 'cat(as.character(getRversion()))')"
          if [[ "$r_version" != "4.5.2" ]]; then
            echo "Expected hosted R 4.5.2, got $r_version." >&2
            exit 1
          fi
          printf 'executable=%s\n' "$rscript" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$r_version" >> "$GITHUB_OUTPUT"
          printf 'Hosted R: %s\n' "$r_version"
      - run: npm ci --ignore-scripts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: python -m pip install --no-deps "https://files.pythonhosted.org/packages/90/b0/114463d056b6b328d45557001e848b8ab15539bd8f4fa7a457ccb83e2b5d/uv-0.11.32-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=3da76cd4e2697de30928b8a8524bd39183ac1e08cb7e72833807c022b7cba6c4"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target != 'linux-python' }}
      - run: npm run lock:remote-jupyter:check
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target != 'linux-python' }}
      - run: npm run audit:remote-jupyter
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target != 'linux-python' }}
      - run: npm run clean && npm run build && npm run package:prepared -- --out openwrangler.vsix
      - run: npm run verify:vsix -- openwrangler.vsix
      - run: npm run build:test-extension
      - id: prepare_xvfb
        name: Prepare pinned private Xvfb
        shell: node {0}
        run: |
          const { execFileSync } = require("node:child_process");
          const { X_OK } = require("node:constants");
          const { accessSync, appendFileSync, lstatSync } = require("node:fs");
          const { isAbsolute } = require("node:path");

          const output = execFileSync(process.execPath, ["scripts/prepare-xvfb.mjs", "--print-path"], {
            cwd: process.cwd(),
            encoding: "utf8",
            stdio: ["ignore", "pipe", "inherit"]
          });
          if (!/^[^\0\r\n]+\n?$/u.test(output)) {
            throw new Error("The Xvfb preparer must print exactly one path.");
          }
          const executable = output.endsWith("\n") ? output.slice(0, -1) : output;
          if (!isAbsolute(executable)) throw new Error("The prepared Xvfb path must be absolute.");
          const stat = lstatSync(executable);
          if (!stat.isFile() || stat.isSymbolicLink()) {
            throw new Error("The prepared Xvfb path must be a regular, non-symlink file.");
          }
          accessSync(executable, X_OK);
          appendFileSync(process.env.GITHUB_OUTPUT, `executable=${executable}\n`, "utf8");
      - id: packaged_editor
        name: ${{ inputs.target == 'linux-python' && 'Test local Python notebooks and files in packaged VS Code' || 'Test remote Python Jupyter in packaged VS Code' }}
        if: ${{ inputs.target != 'linux-r' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ACCEPTANCE_TARGET" == "linux-python" ]]; then
            export OPEN_WRANGLER_PACKAGED_MODE=full
            export OPEN_WRANGLER_REAL_REMOTE_JUPYTER=0
            OPEN_WRANGLER_PACKAGED_PYTHON_JUPYTER_PROFILE=python-notebooks \
              /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs openwrangler.vsix
            unset OPEN_WRANGLER_PACKAGED_PYTHON_JUPYTER_PROFILE
            export OPEN_WRANGLER_REAL_JUPYTER_EXTENSION=0
          fi
          /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs openwrangler.vsix
        env:
          ACCEPTANCE_TARGET: ${{ inputs.target }}
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "1"
          VSCODE_TEST_VERSION: stable
      - name: Upload packaged-editor failure diagnostics
        if: ${{ always() && steps.packaged_editor.outcome == 'failure' && steps.packaged_editor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: released-jupyter-python-diagnostics-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: packaged_editor_r
        name: Test released R Jupyter in packaged VS Code and Cursor
        if: ${{ inputs.target == 'linux-all' || (github.event_name == 'workflow_dispatch' && inputs.target == 'linux-r') }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode,cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "1"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload packaged-editor R failure diagnostics
        if: ${{ always() && steps.packaged_editor_r.outcome == 'failure' && steps.packaged_editor_r.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: released-jupyter-r-diagnostics-editors-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: packaged_editor_r_values
        name: Test value R operations in fresh packaged VS Code and Cursor phases
        if: ${{ inputs.target == 'linux-all' || (github.event_name == 'workflow_dispatch' && inputs.target == 'linux-r') }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: value-operations
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode,cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload value R-Jupyter failure diagnostics
        if: ${{ always() && steps.packaged_editor_r_values.outcome == 'failure' && steps.packaged_editor_r_values.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: released-jupyter-r-values-diagnostics-editors-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r_values.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: packaged_editor_r_categorical
        name: Test categorical R operations in fresh packaged VS Code and Cursor phases
        if: ${{ inputs.target == 'linux-all' || (github.event_name == 'workflow_dispatch' && inputs.target == 'linux-r') }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: categorical-operations
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode,cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload categorical R-Jupyter failure diagnostics
        if: ${{ always() && steps.packaged_editor_r_categorical.outcome == 'failure' && steps.packaged_editor_r_categorical.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: released-jupyter-r-categorical-diagnostics-editors-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r_categorical.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: packaged_editor_r_interactive
        name: Test the active R terminal in fresh packaged VS Code and Cursor phases
        if: ${{ inputs.target == 'linux-all' || (github.event_name == 'workflow_dispatch' && inputs.target == 'linux-r') }}
        continue-on-error: true
        run: /usr/bin/dbus-run-session -- node scripts/run-packaged-editor-tests.mjs openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_R_JOURNEY: interactive-terminal
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode,cursor
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Upload active R terminal failure diagnostics
        if: ${{ always() && steps.packaged_editor_r_interactive.outcome == 'failure' && steps.packaged_editor_r_interactive.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: released-jupyter-r-interactive-diagnostics-editors-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r_interactive.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - name: Fail after local R acceptance diagnostics
        if: ${{ always() && (steps.packaged_editor_r.outcome == 'failure' || steps.packaged_editor_r_values.outcome == 'failure' || steps.packaged_editor_r_categorical.outcome == 'failure' || steps.packaged_editor_r_interactive.outcome == 'failure') }}
        run: exit 1

  macos-r:
    name: R checks on macOS
    if: ${{ inputs.target == 'macos-r' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - name: Install system ZeroMQ for IRkernel
        run: brew install zeromq
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      - id: rscript
        name: Locate hosted Rscript
        shell: Rscript {0}
        run: |
          version <- as.character(getRversion())
          if (!identical(version, "4.5.2")) stop("Expected hosted R 4.5.2, got ", version, ".")
          executable <- normalizePath(file.path(R.home("bin"), "Rscript"), winslash = "/", mustWork = TRUE)
          if (!nzchar(executable) || grepl("[\r\n]", executable)) stop("Rscript resolved to an unsafe path.")
          output <- Sys.getenv("GITHUB_OUTPUT")
          if (!nzchar(output)) stop("GITHUB_OUTPUT is not available.")
          cat(sprintf("executable=%s\nversion=%s\n", executable, version), file = output, append = TRUE)
      - run: npm ci --ignore-scripts
      - name: Native macOS process cancellation contracts
        run: npm run test:scripts:native
      - &r_private_artifact_contracts
        name: Check native R artifact cleanup
        run: npx --no-install vitest run --environment node src/test/rPrivateArtifactBoundary.unit.test.ts
      - &r_source_contracts
        name: Check native R numeric and CSV portability
        if: ${{ !inputs.omit_source }}
        shell: node {0}
        env:
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
        run: |
          const { execFileSync } = require("node:child_process");
          const { mkdtempSync, realpathSync } = require("node:fs");
          const { join, resolve } = require("node:path");
          const { pathToFileURL } = require("node:url");

          (async () => {
            const { prepareJupyterAcceptanceREnvironment, rAcceptancePackageRecordMatches } = await import(pathToFileURL(resolve("scripts/jupyter-acceptance-environment.mjs")));
            const { runBoundedEditorCommand } = await import(pathToFileURL(resolve("scripts/editor-acceptance.mjs")));
            const { createEditorAcceptancePrivateRootReceipt, removeEditorAcceptancePrivateRoot } = await import(pathToFileURL(resolve("scripts/packaged-editor-orchestration.mjs")));
            const { createRContractPhases, selectRContractPhases } = await import(pathToFileURL(resolve("scripts/run-r-contract-tests.mjs")));
            const checkout = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8", maxBuffer: 4096 }).trim();
            if (!/^[0-9a-f]{40}$/.test(checkout) || checkout !== process.env.GITHUB_SHA) {
              throw new Error("R source qualification must use the workflow's exact checkout.");
            }
            console.log(`R source checkout: ${checkout}; Node ${process.version}; ${process.platform}/${process.arch}`);
            const parent = realpathSync(process.env.RUNNER_TEMP);
            const privateRoot = mkdtempSync(join(parent, "openwrangler-r-source-"));
            const receipt = createEditorAcceptancePrivateRootReceipt(privateRoot, { containedBy: parent });
            const prepared = await prepareJupyterAcceptanceREnvironment(
              join(privateRoot, "r"), process.env.OPEN_WRANGLER_TEST_RSCRIPT,
              { containedBy: privateRoot, purpose: "source-contracts" }
            );
            const environment = prepared.dependencyProbe.input.environment;
            const runtime = await runBoundedEditorCommand({
              executable: prepared.dependencyProbe.input.executable,
              args: ["--vanilla", "-e", 'cat(R.version.string, R.version$platform, Sys.info()[["sysname"]], Sys.info()[["machine"]], sep = "\\n")'],
              environment,
              label: "R source qualification runtime identity"
            }, prepared.dependencyProbe.options);
            console.log(runtime.stdout);
            await runBoundedEditorCommand(prepared.dependencyInstall.input, prepared.dependencyInstall.options);
            const probe = await runBoundedEditorCommand(prepared.dependencyProbe.input, prepared.dependencyProbe.options);
            if (!rAcceptancePackageRecordMatches(probe.stdout, prepared.packageRecord)) {
              throw new Error("R source qualification did not resolve its reviewed private package versions.");
            }
            console.log(`R source packages:\n${prepared.packageRecord}`);
            const phases = createRContractPhases({
              environment, r: prepared.rExecutable, rscript: prepared.dependencyProbe.input.executable
            });
            // These trusted cases never start child processes. Broad process tests stay in native R CI.
            for (const id of ["kernel:numeric-portability", "kernel:csv-import"]) {
              const [phase] = selectRContractPhases(phases, { kind: "phase", id });
              const startedAt = performance.now();
              const output = execFileSync(phase.command, phase.args, {
                env: phase.environment,
                encoding: "utf8",
                timeout: phase.timeoutMs,
                killSignal: "SIGKILL",
                maxBuffer: 2 * 1024 * 1024,
                stdio: ["ignore", "pipe", "pipe"]
              });
              console.log(output);
              console.log(`${id} passed in ${((performance.now() - startedAt) / 1000).toFixed(1)} s.`);
            }
            // Preparation and both exact R children have succeeded; any earlier failure retains this root.
            removeEditorAcceptancePrivateRoot(receipt, { processTreeVerifiedStopped: true, privatePathsVerified: true });
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
      - &r_source_omission
        name: Record omitted R source check
        if: ${{ inputs.omit_source }}
        shell: bash
        run: echo 'Native R numeric and CSV portability and their private source preparation omitted for proven selected host and renderer edits; no fresh numeric or CSV source execution is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install jupyter-client
      - run: npm run clean && npm run build && npm run package:prepared -- --out openwrangler.vsix
      - run: npm run verify:vsix -- openwrangler.vsix
      - run: npm run build:test-extension
      - id: packaged_editor_r
        name: Test local R Jupyter in packaged VS Code
        if: ${{ !inputs.omit_editor }}
        run: node scripts/run-packaged-editor-tests.mjs openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Record omitted R editor journey
        if: ${{ inputs.omit_editor }}
        shell: bash
        run: echo 'Installed R editor journey omitted for proven source-test edits. Package checks ran; no fresh editor execution is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload macOS R-Jupyter failure diagnostics
        if: ${{ always() && steps.packaged_editor_r.outcome == 'failure' && steps.packaged_editor_r.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: released-jupyter-r-diagnostics-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  windows-r:
    name: R checks on Windows
    if: ${{ inputs.target == 'windows-r' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - id: rscript
        name: Locate hosted Rscript
        shell: Rscript {0}
        run: |
          version <- as.character(getRversion())
          if (!identical(version, "4.5.2")) stop("Expected hosted R 4.5.2, got ", version, ".")
          executable <- normalizePath(file.path(R.home("bin"), "Rscript.exe"), winslash = "/", mustWork = TRUE)
          if (!nzchar(executable) || grepl("[\r\n]", executable)) stop("Rscript resolved to an unsafe path.")
          output <- Sys.getenv("GITHUB_OUTPUT")
          if (!nzchar(output)) stop("GITHUB_OUTPUT is not available.")
          cat(sprintf("executable=%s\nversion=%s\n", executable, version), file = output, append = TRUE)
      - run: npm ci --ignore-scripts
      - name: Native Windows R process ownership
        run: node --test scripts/windows-job-supervisor.native.test.mjs
      - name: Windows R startup diagnostic
        run: node node_modules/vitest/vitest.mjs run src/test/rProcessTransport.cross.test.ts -t "fixed Windows bootstrap diagnostic" --maxWorkers=1
        env:
          OPEN_WRANGLER_R_CONTRACT_TESTS: "1"
          RSCRIPT: ${{ steps.rscript.outputs.executable }}
      - *r_private_artifact_contracts
      - *r_source_contracts
      - *r_source_omission
      - run: python -m pip install --upgrade pip
      - run: python -m pip install jupyter-client
      - run: npm run clean && npm run build && npm run package:prepared -- --out openwrangler.vsix
      - run: npm run verify:vsix -- openwrangler.vsix
      - run: npm run build:test-extension
      - id: packaged_editor_r
        name: Test local R Jupyter in packaged VS Code
        if: ${{ !inputs.omit_editor }}
        run: node scripts/run-packaged-editor-tests.mjs openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_MODE: r-jupyter
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "0"
          OPEN_WRANGLER_TEST_RSCRIPT: ${{ steps.rscript.outputs.executable }}
          VSCODE_TEST_VERSION: stable
      - name: Record omitted R editor journey
        if: ${{ inputs.omit_editor }}
        shell: bash
        run: echo 'Installed R editor journey omitted for proven source-test edits. Package checks ran; no fresh editor execution is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Windows R-Jupyter failure diagnostics
        if: ${{ always() && steps.packaged_editor_r.outcome == 'failure' && steps.packaged_editor_r.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: released-jupyter-r-diagnostics-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor_r.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
