            test -f "$artifact_path"
            test "$(stat --format='%F' -- "$artifact_path")" = "regular file"
            test "$(stat --format='%h' -- "$artifact_path")" = "1"
            artifact_identity="$(stat --format='%d:%i:%f:%h' -- "$artifact_path")"
            test "$(stat --format='%s' -- "$artifact_path")" = "$size"
            read -r actual_sha256 _ < <(sha256sum -- "$artifact_path")
            test "$actual_sha256" = "$sha256"
            test "$(dpkg-deb --field "$artifact_path" Package)" = "$package"
            test "$(dpkg-deb --field "$artifact_path" Version)" = "$version"
            test "$(dpkg-deb --field "$artifact_path" Architecture)" = "$architecture"
            test "$(stat --format='%d:%i:%f:%h' -- "$artifact_path")" = "$artifact_identity"
            install_paths+=("$artifact_path")
            verified_count=$((verified_count + 1))
            verified_bytes=$((verified_bytes + size))
          done <<< "$artifact_manifest"
          test "$verified_count" = "$artifact_count"
          test "$verified_bytes" = "$artifact_bytes"
          test "$(find "$artifact_dir" -mindepth 1 -maxdepth 1 | wc -l)" = "$artifact_count"
