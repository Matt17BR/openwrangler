name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: CI change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      r_contract_required: ${{ steps.classify.outputs.r_contract_required }}
      canonical_editor_required: ${{ steps.classify.outputs.canonical_editor_required }}
      visual_accessibility_required: ${{ steps.classify.outputs.visual_accessibility_required }}
      windows_unique_required: ${{ steps.classify.outputs.windows_unique_required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - id: classify
        run: node scripts/ci-path-classification.mjs
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  invariant-core:
    name: Invariant core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - id: reference_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e "python[dev]"
      - name: Install the exact remote-Jupyter lock compiler
        run: python -m pip install --no-deps "https://files.pythonhosted.org/packages/90/b0/114463d056b6b328d45557001e848b8ab15539bd8f4fa7a457ccb83e2b5d/uv-0.11.32-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=3da76cd4e2697de30928b8a8524bd39183ac1e08cb7e72833807c022b7cba6c4"
      - name: Portable, TypeScript, Python 3.10, schema, protocol, reference, docs, and license invariants
        run: npm run check:tier-a
        env:
          OPEN_WRANGLER_PYTHON: ${{ steps.reference_python.outputs.python-path }}
      - name: Remote Jupyter lock reproducibility
        run: npm run lock:remote-jupyter:check
      - name: Full development dependency audit
        run: npm audit
      - name: Full Python and fixture dependency audits
        run: npm run audit:python

  r-contract-kernel:
    name: R 4.5 kernel contract
    needs: [classify, invariant-core]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'pull_request' &&
        needs.invariant-core.result == 'success' &&
        (needs.classify.result != 'success' || needs.classify.outputs.r_contract_required != 'false')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5"
          use-public-rspm: false
      - name: Install the declared system requirement
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libx11-dev
          dpkg-query --show --showformat='libx11-dev=${Version}\n' libx11-dev
      - run: npm ci
      - id: r_prepare
        name: Validate the R 4.5 lock before cache or network mutation
        run: >-
          node scripts/r-dependency-lock.mjs prepare
          --lock r/dependencies/native-r-contract/ubuntu-24.04-x86_64-r-4.5.lock.json
          --rscript "$(command -v Rscript)"
          --library "$RUNNER_TEMP/openwrangler-r-contract-4.5-kernel-library"
          --archives "$RUNNER_TEMP/openwrangler-r-contract-4.5-kernel-archives"
          --receipt "$RUNNER_TEMP/openwrangler-r-contract-4.5-kernel-receipt.json"
      - id: r_cache
        name: Restore the untrusted exact R archive cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.r_prepare.outputs.archives }}
          key: ${{ steps.r_prepare.outputs.cache-key }}
          fail-on-cache-miss: false
      - id: r_install
        name: Verify archives and cold-install the exact R library
        run: >-
          node scripts/r-dependency-lock.mjs install
          --lock r/dependencies/native-r-contract/ubuntu-24.04-x86_64-r-4.5.lock.json
          --rscript "$(command -v Rscript)"
          --library "${{ steps.r_prepare.outputs.library }}"
          --archives "${{ steps.r_prepare.outputs.archives }}"
          --receipt "${{ steps.r_prepare.outputs.receipt }}"
          --cache-hit "${{ steps.r_cache.outputs.cache-hit == 'true' }}"
      - name: Save only a newly authenticated R archive cache
        if: ${{ steps.r_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.r_prepare.outputs.archives }}
          key: ${{ steps.r_prepare.outputs.cache-key }}
      - run: npm run test:r-contract -- --shard kernel-agent
        env:
          R_LIBS_USER: ${{ steps.r_prepare.outputs.library }}

  r-contract-protocol:
    name: R 4.5 protocol contracts
    needs: [classify, invariant-core]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'pull_request' &&
        needs.invariant-core.result == 'success' &&
        (needs.classify.result != 'success' || needs.classify.outputs.r_contract_required != 'false')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5"
          use-public-rspm: false
      - name: Install the declared system requirement
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libx11-dev
          dpkg-query --show --showformat='libx11-dev=${Version}\n' libx11-dev
      - run: npm ci
      - id: r_prepare
        name: Validate the R 4.5 lock before cache or network mutation
        run: >-
          node scripts/r-dependency-lock.mjs prepare
          --lock r/dependencies/native-r-contract/ubuntu-24.04-x86_64-r-4.5.lock.json
          --rscript "$(command -v Rscript)"
          --library "$RUNNER_TEMP/openwrangler-r-contract-4.5-protocol-library"
          --archives "$RUNNER_TEMP/openwrangler-r-contract-4.5-protocol-archives"
          --receipt "$RUNNER_TEMP/openwrangler-r-contract-4.5-protocol-receipt.json"
      - id: r_cache
        name: Restore the untrusted exact R archive cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.r_prepare.outputs.archives }}
          key: ${{ steps.r_prepare.outputs.cache-key }}
          fail-on-cache-miss: false
      - name: Verify archives and cold-install the exact R library
        run: >-
          node scripts/r-dependency-lock.mjs install
          --lock r/dependencies/native-r-contract/ubuntu-24.04-x86_64-r-4.5.lock.json
          --rscript "$(command -v Rscript)"
          --library "${{ steps.r_prepare.outputs.library }}"
          --archives "${{ steps.r_prepare.outputs.archives }}"
          --receipt "${{ steps.r_prepare.outputs.receipt }}"
          --cache-hit "${{ steps.r_cache.outputs.cache-hit == 'true' }}"
      - name: Save only a newly authenticated R archive cache
        if: ${{ steps.r_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.r_prepare.outputs.archives }}
          key: ${{ steps.r_prepare.outputs.cache-key }}
      - name: Run both independent protocol shards fail-complete
        run: npm run test:r-contract:protocol
        env:
          R_LIBS_USER: ${{ steps.r_prepare.outputs.library }}

  native-r-contract:
    name: Native R contract (R 4.4)
    needs: [classify, invariant-core]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'pull_request' &&
        needs.invariant-core.result == 'success' &&
        (needs.classify.result != 'success' || needs.classify.outputs.r_contract_required != 'false')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.4"
          use-public-rspm: false
      - name: Install the declared system requirement
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libx11-dev
          dpkg-query --show --showformat='libx11-dev=${Version}\n' libx11-dev
      - run: npm ci
      - id: r_prepare
        name: Validate the R 4.4 lock before cache or network mutation
        run: >-
          node scripts/r-dependency-lock.mjs prepare
          --lock r/dependencies/native-r-contract/ubuntu-24.04-x86_64-r-4.4.lock.json
          --rscript "$(command -v Rscript)"
          --library "$RUNNER_TEMP/openwrangler-r-contract-4.4-pr-library"
          --archives "$RUNNER_TEMP/openwrangler-r-contract-4.4-pr-archives"
          --receipt "$RUNNER_TEMP/openwrangler-r-contract-4.4-pr-receipt.json"
      - id: r_cache
        name: Restore the untrusted exact R archive cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.r_prepare.outputs.archives }}
          key: ${{ steps.r_prepare.outputs.cache-key }}
          fail-on-cache-miss: false
      - name: Verify archives and cold-install the exact R library
        run: >-
          node scripts/r-dependency-lock.mjs install
          --lock r/dependencies/native-r-contract/ubuntu-24.04-x86_64-r-4.4.lock.json
          --rscript "$(command -v Rscript)"
          --library "${{ steps.r_prepare.outputs.library }}"
          --archives "${{ steps.r_prepare.outputs.archives }}"
          --receipt "${{ steps.r_prepare.outputs.receipt }}"
          --cache-hit "${{ steps.r_cache.outputs.cache-hit == 'true' }}"
      - name: Save only a newly authenticated R archive cache
        if: ${{ steps.r_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.r_prepare.outputs.archives }}
          key: ${{ steps.r_prepare.outputs.cache-key }}
      - run: npm run test:r-contract
        env:
          R_LIBS_USER: ${{ steps.r_prepare.outputs.library }}

  canonical-editor:
    name: Canonical package and editor
    needs: [classify, invariant-core]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'pull_request' &&
        needs.invariant-core.result == 'success' &&
        (needs.classify.result != 'success' || needs.classify.outputs.canonical_editor_required != 'false')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e "python[dev]"
      - run: npm run clean
      - run: npm run build
      - run: npm run package:prepared -- --out openwrangler.vsix
      - run: npm run verify:vsix -- openwrangler.vsix
      - run: npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: stable
      - run: npm run build:test-extension
      - id: packaged_editor
        name: Test packaged editor
        run: node scripts/run-packaged-editor-tests.mjs openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          VSCODE_TEST_VERSION: stable
      - name: Upload packaged-editor failure diagnostics
        if: ${{ !cancelled() && steps.packaged_editor.outcome == 'failure' && steps.packaged_editor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packaged-editor-diagnostics-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  visual-accessibility:
    name: Visual and accessibility
    needs: [classify, invariant-core]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'pull_request' &&
        needs.invariant-core.result == 'success' &&
        (needs.classify.result != 'success' || needs.classify.outputs.visual_accessibility_required != 'false')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e "python[dev]"
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:webview-acceptance
      - if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: webview-visual-evidence
          path: |
            tmp/screenshots-actual/
            tmp/screenshots-diff/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  windows-unique:
    name: Windows unique-risk contracts
    needs: [classify, invariant-core]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'pull_request' &&
        needs.invariant-core.result == 'success' &&
        (needs.classify.result != 'success' || needs.classify.outputs.windows_unique_required != 'false')
      }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e "python[dev]"
      - name: Windows publication, identity, dependency, and cleanup contracts
        run: >-
          python -m pytest -q
          python/tests/test_export_target.py
          python/tests/test_duckdb_export_filesystem.py
          python/tests/test_dependency_guard.py
          python/tests/test_dependency_guard_exact_version.py
          python/tests/test_session_editing.py
      - run: npm run test:scripts:native
      - run: >-
          npx vitest run
          src/test/dependencyInstaller.unit.test.ts
          src/test/processShutdown.unit.test.ts
          src/test/pythonEnvironment.unit.test.ts

  validate:
    name: validate
    needs:
      - classify
      - invariant-core
      - r-contract-kernel
      - r-contract-protocol
      - native-r-contract
      - canonical-editor
      - visual-accessibility
      - windows-unique
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Require every owned CI result
        run: node scripts/require-ci-results.mjs
        env:
          R_CONTRACT_REQUIRED: ${{ needs.classify.outputs.r_contract_required }}
          CANONICAL_EDITOR_REQUIRED: ${{ needs.classify.outputs.canonical_editor_required }}
          VISUAL_ACCESSIBILITY_REQUIRED: ${{ needs.classify.outputs.visual_accessibility_required }}
          WINDOWS_UNIQUE_REQUIRED: ${{ needs.classify.outputs.windows_unique_required }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          INVARIANT_CORE_RESULT: ${{ needs.invariant-core.result }}
          R_CONTRACT_KERNEL_RESULT: ${{ needs.r-contract-kernel.result }}
          R_CONTRACT_PROTOCOL_RESULT: ${{ needs.r-contract-protocol.result }}
          NATIVE_R_CONTRACT_RESULT: ${{ needs.native-r-contract.result }}
          CANONICAL_EDITOR_RESULT: ${{ needs.canonical-editor.result }}
          VISUAL_ACCESSIBILITY_RESULT: ${{ needs.visual-accessibility.result }}
          WINDOWS_UNIQUE_RESULT: ${{ needs.windows-unique.result }}
