          provisioning_checkpoint "package database audit command"
          timeout --signal=TERM --kill-after=5s 30s dpkg --audit | head --bytes=65537 > "$dpkg_audit_path"
          dpkg_audit_size="$(stat --format='%s' -- "$dpkg_audit_path")"
          provisioning_checkpoint "package database audit output bound"
          test "$dpkg_audit_size" -le 65536
          provisioning_checkpoint "package database audit output empty"
          test ! -s "$dpkg_audit_path"
          while IFS="|" read -r filename package version architecture size sha256 url; do
            provisioning_checkpoint "package ${package}"
            test "$(dpkg-query --show --showformat='${Status}|${Version}|${Architecture}' "$package")" = \
