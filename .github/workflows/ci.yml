          xtrans-dev_1.4.0-1_all.deb|xtrans-dev|1.4.0-1|all|68900|45277c51d5d83db351b61859314b59595c9626ac372fbb2fc0d5542e169d9086|https://archive.ubuntu.com/ubuntu/pool/main/x/xtrans/xtrans-dev_1.4.0-1_all.deb
          libx11-dev_1.8.7-1build1_amd64.deb|libx11-dev|2:1.8.7-1build1|amd64|732214|1969e200607ffe34070b92fe1bd3ba76ac2e2bd2f3a54530800c5872076fad24|https://archive.ubuntu.com/ubuntu/pool/main/libx/libx11/libx11-dev_1.8.7-1build1_amd64.deb
          r-4.5.3_1_amd64.deb|r-4.5.3|1|amd64|67491866|93a403f207fa6c8d50754106097f551ba0c55c5b756363d070ac76e880334ca8|https://cdn.posit.co/r/ubuntu-2404/pkgs/r-4.5.3_1_amd64.deb
          ARTIFACTS
          )"
          timeout --signal=TERM --kill-after=10s 300s bash -c '
            set -euo pipefail
            artifact_dir="$1"
            while IFS="|" read -r filename package version architecture size sha256 url; do
              case "$filename" in ""|*/*) exit 1 ;; esac
              artifact_path="${artifact_dir}/${filename}"
              timeout --signal=TERM --kill-after=5s 180s \
                curl --fail --location --proto "=https" --tlsv1.2 --connect-timeout 20 --max-time 175 --max-filesize "$size" \
                --output "$artifact_path" "$url"
              test ! -L "$artifact_path"
              test -f "$artifact_path"
              test "$(stat --format="%F" -- "$artifact_path")" = "regular file"
              test "$(stat --format="%h" -- "$artifact_path")" = "1"
              artifact_identity="$(stat --format="%d:%i:%f:%h" -- "$artifact_path")"
              test "$(stat --format="%s" -- "$artifact_path")" = "$size"
              read -r actual_sha256 _ < <(sha256sum -- "$artifact_path")
              test "$actual_sha256" = "$sha256"
              test "$(dpkg-deb --field "$artifact_path" Package)" = "$package"
              test "$(dpkg-deb --field "$artifact_path" Version)" = "$version"
              test "$(dpkg-deb --field "$artifact_path" Architecture)" = "$architecture"
              test "$(stat --format="%d:%i:%f:%h" -- "$artifact_path")" = "$artifact_identity"
            done
          ' bash "$artifact_dir" <<< "$artifact_manifest"
          install_paths=()
          verified_count=0
          verified_bytes=0
          while IFS="|" read -r filename package version architecture size sha256 url; do
            artifact_path="${artifact_dir}/${filename}"
            test ! -L "$artifact_path"
            test -f "$artifact_path"
            test "$(stat --format='%F' -- "$artifact_path")" = "regular file"
            test "$(stat --format='%h' -- "$artifact_path")" = "1"
            artifact_identity="$(stat --format='%d:%i:%f:%h' -- "$artifact_path")"
            test "$(stat --format='%s' -- "$artifact_path")" = "$size"
            read -r actual_sha256 _ < <(sha256sum -- "$artifact_path")
            test "$actual_sha256" = "$sha256"
            test "$(dpkg-deb --field "$artifact_path" Package)" = "$package"
            test "$(dpkg-deb --field "$artifact_path" Version)" = "$version"
            test "$(dpkg-deb --field "$artifact_path" Architecture)" = "$architecture"
            test "$(stat --format='%d:%i:%f:%h' -- "$artifact_path")" = "$artifact_identity"
            install_paths+=("$artifact_path")
            verified_count=$((verified_count + 1))
            verified_bytes=$((verified_bytes + size))
          done <<< "$artifact_manifest"
          test "$verified_count" = "$artifact_count"
          test "$verified_bytes" = "$artifact_bytes"
          test "$(find "$artifact_dir" -mindepth 1 -maxdepth 1 | wc -l)" = "$artifact_count"
          sudo --non-interactive timeout --signal=TERM --kill-after=10s 180s \
            dpkg --install -- "${install_paths[@]}"
          provisioning_checkpoint "offline install complete"
          dpkg_audit_path="${artifact_dir}/dpkg-audit.txt"
          provisioning_checkpoint "package database audit command"
          timeout --signal=TERM --kill-after=5s 30s dpkg --audit | head --bytes=65537 > "$dpkg_audit_path"
          dpkg_audit_size="$(stat --format='%s' -- "$dpkg_audit_path")"
          provisioning_checkpoint "package database audit output bound"
          test "$dpkg_audit_size" -le 65536
          provisioning_checkpoint "package database audit output empty"
          test ! -s "$dpkg_audit_path"
          while IFS="|" read -r filename package version architecture size sha256 url; do
            provisioning_checkpoint "package ${package}"
            test "$(dpkg-query --show --showformat='${Status}|${Version}|${Architecture}' "$package")" = \
              "install ok installed|${version}|${architecture}"
          done <<< "$artifact_manifest"
          provisioning_checkpoint "libx11-dev package"
          test "$(dpkg-query --show --showformat='${Status}|${Version}|${Architecture}' libx11-dev)" = \
            "install ok installed|2:1.8.7-1build1|amd64"
          readonly r_library_dir="/opt/R/4.5.3/lib/R/lib"
          provisioning_checkpoint "R library directory not a symlink"
          test ! -L "$r_library_dir"
          provisioning_checkpoint "R library directory type"
          test -d "$r_library_dir"
          ldd_index=0
          for r_binary in /opt/R/4.5.3/lib/R/bin/exec/R /opt/R/4.5.3/lib/R/lib/libR.so; do
            provisioning_checkpoint "R shared object ${ldd_index} not a symlink"
            test ! -L "$r_binary"
            provisioning_checkpoint "R shared object ${ldd_index} type"
            test -f "$r_binary"
            ldd_output_path="${artifact_dir}/ldd-${ldd_index}.txt"
            provisioning_checkpoint "R shared object ${ldd_index} dependency command"
            timeout --signal=TERM --kill-after=5s 30s \
              env LD_LIBRARY_PATH="${r_library_dir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" ldd "$r_binary" | \
              head --bytes=65537 > "$ldd_output_path"
            ldd_output_size="$(stat --format='%s' -- "$ldd_output_path")"
            provisioning_checkpoint "R shared object ${ldd_index} output bound"
            test "$ldd_output_size" -le 65536
            provisioning_checkpoint "R shared object ${ldd_index} dependencies resolved"
            while IFS= read -r dependency_line; do
              case "$dependency_line" in *"not found"*) exit 1 ;; esac
            done < "$ldd_output_path"
            ldd_index=$((ldd_index + 1))
          done
          provisioning_checkpoint "R shared object count"
          test "$ldd_index" = "2"
          provisioning_checkpoint "R package status"
          test "$(dpkg-query --show --showformat='${Status}|${Version}|${Architecture}' r-4.5.3)" = \
            "install ok installed|1|amd64"
          provisioning_checkpoint "R version"
          test "$(/opt/R/4.5.3/bin/Rscript --vanilla -e 'cat(as.character(getRversion()))')" = "4.5.3"
          provisioning_checkpoint "R executable path export"
          printf '%s\n' '/opt/R/4.5.3/bin' >> "$GITHUB_PATH"
          provisioning_checkpoint "complete"
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.3"
          install-r: false
          use-public-rspm: false
      - run: npm ci --ignore-scripts
      - id: r_prepare
        name: Validate the R 4.5 lock before cache or network mutation
        run: >-
          node scripts/r-dependency-lock.mjs prepare
          --lock r/dependencies/native-r-contract/ubuntu-24.04-x86_64-r-4.5.lock.json
          --rscript "$(command -v Rscript)"
          --library "$RUNNER_TEMP/openwrangler-r-contract-4.5-kernel-library"
          --archives "$RUNNER_TEMP/openwrangler-r-contract-4.5-kernel-archives"
          --receipt "$RUNNER_TEMP/openwrangler-r-contract-4.5-kernel-receipt.json"
      - id: r_cache
        name: Restore the untrusted exact R archive cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.r_prepare.outputs.archives }}
          key: ${{ steps.r_prepare.outputs.cache-key }}
          fail-on-cache-miss: false
      - id: r_install
        name: Verify archives and cold-install the exact R library
        run: >-
          node scripts/r-dependency-lock.mjs install
          --lock r/dependencies/native-r-contract/ubuntu-24.04-x86_64-r-4.5.lock.json
          --rscript "$(command -v Rscript)"
          --library "${{ steps.r_prepare.outputs.library }}"
          --archives "${{ steps.r_prepare.outputs.archives }}"
          --receipt "${{ steps.r_prepare.outputs.receipt }}"
          --cache-hit "${{ steps.r_cache.outputs.cache-hit == 'true' }}"
      - name: Save only a newly authenticated R archive cache
        if: ${{ steps.r_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.r_prepare.outputs.archives }}
          key: ${{ steps.r_prepare.outputs.cache-key }}
      - run: npm run test:r-contract -- --shard kernel-agent
        env:
          R_LIBS_USER: ${{ steps.r_prepare.outputs.library }}

  r-contract-protocol:
    name: R 4.5 protocol contracts
    needs: [classify]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'pull_request' &&
        (needs.classify.result != 'success' || needs.classify.outputs.r_contract_required != 'false')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the authenticated R 4.5.3 runtime
        run: |
          set -euo pipefail
          export LC_ALL=C
          provisioning_checkpoint() {
            printf 'R 4.5.3 provisioning checkpoint: %s\n' "$1"
          }
