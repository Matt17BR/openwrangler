name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Source contracts (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Formatting and lint
        run: |
          npm run format:check
          npm run lint
      - name: TypeScript types
        run: |
          npm run typecheck
          npm run typecheck:dependencies
      - name: Generated protocols and documentation
        run: |
          npm run protocol:check
          npm run reference:check
          npm run docs:check
      - name: Dependency locks and licenses
        run: |
          npm run check:remote-jupyter-lock
          npm run check:r-dependency-lock
          npm run license:check
      - name: Direct script contracts
        run: npm run test:scripts
      - name: TypeScript tests
        run: npx --no-install vitest run
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
      - name: Build with supported Node 22
        run: npm run build

  python:
    name: Python runtime contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - id: python_runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci --ignore-scripts
      - run: python -m pip install -e "python[dev]"
      - run: python -m pip install "pandas>=2.2,<3.0" "pyspark[connect]==4.2.0"
      - name: Python lint and formatting
        run: |
          python -m ruff check python
          python -m ruff format --check python
      - name: Python types
        run: node scripts/run-pyright.mjs python
        env:
          OPEN_WRANGLER_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
      - name: Python tests
        run: python -m pytest python/tests -q

  r:
    name: Native R frame, kernel, and transport contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: "4.5.3"
          use-public-rspm: false
      - name: Install the R lock's system requirement
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libx11-dev
          dpkg-query --show --showformat='libx11-dev=${Version}\n' libx11-dev
      - run: npm ci --ignore-scripts
      - id: r_prepare
        name: Prepare R dependencies
        run: >-
          node scripts/r-dependency-lock.mjs prepare
          --lock r/dependencies/native-r-contract/ubuntu-24.04-x86_64-r-4.5.lock.json
          --rscript "$(command -v Rscript)"
          --library "$RUNNER_TEMP/openwrangler-r-contract-4.5-library"
          --archives "$RUNNER_TEMP/openwrangler-r-contract-4.5-archives"
          --receipt "$RUNNER_TEMP/openwrangler-r-contract-4.5-receipt.json"
      - id: r_cache
        name: Restore R package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.r_prepare.outputs.archives }}
          key: ${{ steps.r_prepare.outputs.cache-key }}
          fail-on-cache-miss: false
      - name: Install R dependencies
        run: >-
          node scripts/r-dependency-lock.mjs install
          --lock r/dependencies/native-r-contract/ubuntu-24.04-x86_64-r-4.5.lock.json
          --rscript "$(command -v Rscript)"
          --library "${{ steps.r_prepare.outputs.library }}"
          --archives "${{ steps.r_prepare.outputs.archives }}"
          --receipt "${{ steps.r_prepare.outputs.receipt }}"
          --cache-hit "${{ steps.r_cache.outputs.cache-hit == 'true' }}"
      - name: Save R package cache
        if: ${{ steps.r_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.r_prepare.outputs.archives }}
          key: ${{ steps.r_prepare.outputs.cache-key }}
      - name: Native frame and interactive transport
        run: node scripts/run-r-contract-tests.mjs --shard frame-and-interactive-transport
        env:
          R_LIBS_USER: ${{ steps.r_prepare.outputs.library }}
      - name: Native kernel-agent contracts
        run: node scripts/run-r-contract-tests.mjs --shard kernel-agent
        env:
          R_LIBS_USER: ${{ steps.r_prepare.outputs.library }}
      - name: Catalog and process transport
        run: node scripts/run-r-contract-tests.mjs --shard catalog-and-process-transport
        env:
          R_LIBS_USER: ${{ steps.r_prepare.outputs.library }}

  package-editor:
    name: Packaged VS Code smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install -e "python[dev]"
      - run: npm run clean
      - run: npm run build
      - run: npm run package:prepared -- --out openwrangler.vsix
      - run: npm run verify:vsix -- openwrangler.vsix
      - name: Compile the installed-editor harness
        run: npm run build:test-extension
      - id: packaged_editor
        name: Open the package in minimum and stable VS Code
        run: |
          VSCODE_TEST_VERSION=1.106.0 node scripts/run-packaged-editor-tests.mjs openwrangler.vsix
          VSCODE_TEST_VERSION=stable node scripts/run-packaged-editor-tests.mjs openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_PACKAGED_MODE: platform-smoke
          OPEN_WRANGLER_TEST_SELECTOR: daily-core
      - name: Upload packaged-editor failure diagnostics
        if: ${{ !cancelled() && steps.packaged_editor.outcome == 'failure' && steps.packaged_editor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packaged-editor-diagnostics-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  windows:
    name: Windows filesystem and process contracts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install -e "python[dev]"
      - name: Windows export filesystem contracts
        run: |
          python -m pytest -q python/tests/test_export_target.py -k windows
          python -m pytest -q python/tests/test_duckdb_export_filesystem.py
      - name: Windows dependency filesystem contracts
        run: |
          python -m pytest -q python/tests/test_dependency_guard.py -k windows
          python -m pytest -q python/tests/test_dependency_guard_exact_version.py
      - name: Windows dependency and process cleanup contracts
        run: >-
          npx --no-install vitest run
          src/test/dependencyInstaller.unit.test.ts
          src/test/processShutdown.unit.test.ts
