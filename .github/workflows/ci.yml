name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run clean
      - run: npm run build
      - run: npm run package:prepared -- --out openwrangler.vsix
      - run: npm run verify:vsix -- openwrangler.vsix
      - name: Create canonical PR checksum
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const { readFileSync, writeFileSync } = require("node:fs");

          const digest = createHash("sha256").update(readFileSync("openwrangler.vsix")).digest("hex");
          writeFileSync("openwrangler.vsix.sha256", `${digest}  openwrangler.vsix\n`);
      - name: Revalidate canonical PR checksum
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const receipt = readFileSync("openwrangler.vsix.sha256", "utf8");
          const match = /^([0-9a-f]{64})  openwrangler\.vsix\n$/u.exec(receipt);
          if (!match) throw new Error("The canonical PR checksum receipt is malformed.");
          const actual = createHash("sha256").update(readFileSync("openwrangler.vsix")).digest("hex");
          if (actual !== match[1]) throw new Error("The canonical PR VSIX checksum changed before upload.");
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: openwrangler-vsix
          path: |
            openwrangler.vsix
            openwrangler.vsix.sha256
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          overwrite: true

  validate:
    needs: canonical-vsix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the canonical PR artifact
        if: ${{ needs.canonical-vsix.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: python -m pip install --no-deps "https://files.pythonhosted.org/packages/90/b0/114463d056b6b328d45557001e848b8ab15539bd8f4fa7a457ccb83e2b5d/uv-0.11.32-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=3da76cd4e2697de30928b8a8524bd39183ac1e08cb7e72833807c022b7cba6c4"
      - run: npm run lock:remote-jupyter:check
      - run: npm run check
      - run: npm test
      - run: npm run test:webview-acceptance
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: webview-visual-evidence
          path: |
            tmp/screenshots-actual/
            tmp/screenshots-diff/
          if-no-files-found: ignore
      - run: npm audit --omit=dev
      - run: npm run audit:python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwrangler-vsix
          path: canonical-vsix
      - name: Verify canonical PR checksum
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const receipt = readFileSync("canonical-vsix/openwrangler.vsix.sha256", "utf8");
          const match = /^([0-9a-f]{64})  openwrangler\.vsix\n$/u.exec(receipt);
          if (!match) throw new Error("The canonical PR checksum receipt is malformed.");
          const actual = createHash("sha256")
            .update(readFileSync("canonical-vsix/openwrangler.vsix"))
            .digest("hex");
          if (actual !== match[1]) throw new Error("The canonical PR VSIX checksum does not match.");
      - run: npm run verify:vsix -- canonical-vsix/openwrangler.vsix
      - run: npm run build:test-extension
      - id: packaged_editor
        name: Test packaged editor
        run: node scripts/run-packaged-editor-tests.mjs canonical-vsix/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          VSCODE_TEST_VERSION: stable
      - name: Upload packaged-editor failure diagnostics
        if: ${{ always() && steps.packaged_editor.outcome == 'failure' && steps.packaged_editor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packaged-editor-diagnostics-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e "python[dev]"
      - run: npm run test:coverage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-reports
          path: |
            coverage/
            tmp/coverage/python.xml

  python-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v6
        if: matrix.python == '3.10'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: matrix.python == '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: npm run test:python-environment-smoke
        if: matrix.python == '3.10'
      - run: python -m pytest python/tests -q

  extension-host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.105.0", "stable"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e "python[dev]"
      - run: npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  native-editor-matrix:
    name: Native editor (${{ matrix.os }})
    needs: canonical-vsix
    if: ${{ always() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Require the canonical PR artifact
        if: ${{ needs.canonical-vsix.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npm run test:scripts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwrangler-vsix
          path: canonical-vsix
      - name: Verify canonical PR checksum
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const receipt = readFileSync("canonical-vsix/openwrangler.vsix.sha256", "utf8");
          const match = /^([0-9a-f]{64})  openwrangler\.vsix\n$/u.exec(receipt);
          if (!match) throw new Error("The canonical PR checksum receipt is malformed.");
          const actual = createHash("sha256")
            .update(readFileSync("canonical-vsix/openwrangler.vsix"))
            .digest("hex");
          if (actual !== match[1]) throw new Error("The canonical PR VSIX checksum does not match.");
      - run: npm run verify:vsix -- canonical-vsix/openwrangler.vsix
      - id: packaged_editor
        name: Test packaged editor
        run: node scripts/run-packaged-editor-tests.mjs canonical-vsix/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          VSCODE_TEST_VERSION: stable
      - name: Upload packaged-editor failure diagnostics
        if: ${{ always() && steps.packaged_editor.outcome == 'failure' && steps.packaged_editor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packaged-editor-diagnostics-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
      - id: cursor_smoke
        name: Test pinned Cursor platform smoke
        run: node scripts/run-packaged-editor-tests.mjs canonical-vsix/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: cursor
          OPEN_WRANGLER_PACKAGED_MODE: platform-smoke
      - name: Upload Cursor-smoke failure diagnostics
        if: ${{ always() && steps.cursor_smoke.outcome == 'failure' && steps.cursor_smoke.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packaged-editor-diagnostics-cursor-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.cursor_smoke.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  remote-workspace:
    name: Remote SSH acceptance
    needs: canonical-vsix
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'acceptance:remote-ssh')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require the canonical PR artifact
        if: ${{ needs.canonical-vsix.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Prepare namespace-capable acceptance host
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap \
            busybox-static \
            coreutils \
            iproute2 \
            libtomcrypt1 \
            libtommath1 \
            openssh-client \
            procps \
            python3-venv \
            x11-xkb-utils
          system_runtime_roots=(
            /usr/share/fontconfig
            /usr/share/fonts
            /usr/share/glib-2.0
            /usr/share/icons
            /usr/share/mime
            /usr/share/X11
            /usr/share/zoneinfo
          )
          test ! -L /usr/share
          test "$(realpath /usr/share)" = "/usr/share"
          test "$(stat --format='%u' /usr/share)" = "0"
          sudo chmod go-w -- /usr/share
          test ! -w /usr/share
          for directory in "${system_runtime_roots[@]}"; do
            test ! -L "$directory"
            test "$(realpath "$directory")" = "$directory"
            test "$(stat --format='%u' "$directory")" = "0"
          done
          sudo chmod --recursive go-w -- "${system_runtime_roots[@]}"
          for directory in "${system_runtime_roots[@]}"; do
            test ! -L "$directory"
            test "$(realpath "$directory")" = "$directory"
            test "$(stat --format='%u' "$directory")" = "0"
            unsafe_owner="$(find "$directory" -xdev ! -user root -print -quit)"
            unsafe_mode="$(find "$directory" -xdev \( -type d -o -type f \) -perm /022 -print -quit)"
            unsafe_type="$(find "$directory" -xdev ! -type d ! -type f ! -type l -print -quit)"
            test -z "$unsafe_owner"
            test -z "$unsafe_mode"
            test -z "$unsafe_type"
          done
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          test "$(sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = "0"
          test "$(sysctl --values kernel.unprivileged_userns_clone)" = "1"
          test "$(sysctl --values user.max_user_namespaces)" -gt 0
      - run: npm ci
      - run: /usr/bin/python3 -m venv .remote-venv
      - run: .remote-venv/bin/python -m pip install --upgrade pip
      - run: .remote-venv/bin/python -m pip install ./python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwrangler-vsix
          path: canonical-vsix
      - id: candidate
        name: Verify exact Remote SSH candidate
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const { appendFileSync, readFileSync, statSync } = require("node:fs");
          const { resolve } = require("node:path");

          const candidatePath = resolve("canonical-vsix/openwrangler.vsix");
          const receipt = readFileSync("canonical-vsix/openwrangler.vsix.sha256", "utf8");
          const match = /^([0-9a-f]{64})  openwrangler\.vsix\n$/u.exec(receipt);
          if (!match) throw new Error("The canonical PR checksum receipt is malformed.");
          const bytes = readFileSync(candidatePath);
          const sha256 = createHash("sha256").update(bytes).digest("hex");
          if (sha256 !== match[1]) throw new Error("The canonical PR VSIX checksum does not match.");
          const size = statSync(candidatePath).size;
          if (!Number.isSafeInteger(size) || size <= 0) {
            throw new Error("The canonical PR VSIX size is invalid.");
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `path=${candidatePath}\nsha256=${sha256}\nsize=${size}\n`,
            "utf8"
          );
      - run: npm run verify:vsix -- canonical-vsix/openwrangler.vsix
      - id: remote_workspace
        name: Test packaged VS Code over Remote SSH
        run: >-
          npm run test:remote-workspace --
          ${{ steps.candidate.outputs.path }}
          ${{ steps.candidate.outputs.sha256 }}
          ${{ steps.candidate.outputs.size }}
        env:
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_REMOTE_PYTHON: ${{ github.workspace }}/.remote-venv/bin/python
