name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main, release/1.x]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: CI change classification
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation_only: ${{ steps.classify.outputs.documentation_only }}
      draft_pull_request: ${{ steps.classify.outputs.draft_pull_request }}
      lightweight_only: ${{ steps.classify.outputs.lightweight_only }}
      package_only: ${{ steps.classify.outputs.package_only }}
      full_matrix_required: ${{ steps.classify.outputs.full_matrix_required }}
      released_jupyter_required: ${{ steps.classify.outputs.released_jupyter_required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: classify
        run: node scripts/ci-path-classification.mjs
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_DRAFT: ${{ github.event.pull_request.draft }}

  fast-feedback:
    name: Fast feedback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Protocol freshness
        run: npm run protocol:check
      - name: Reference freshness
        run: npm run reference:check
      - name: Documentation freshness
        run: npm run docs:check
      - name: Production license inventory
        run: npm run license:check
      - name: Workflow contracts
        run: npm run test:scripts:workflow

  canonical-vsix:
    needs: classify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.lightweight_only != 'true') }}
    runs-on: ubuntu-latest
    outputs:
      released_jupyter_required: ${{ needs.classify.outputs.released_jupyter_required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run clean
      - run: npm run build
      - run: npm run package:prepared -- --out openwrangler.vsix
      - run: npm run verify:vsix -- openwrangler.vsix
      - name: Packaged release-media contracts
        if: ${{ needs.classify.outputs.package_only == 'true' }}
        run: npm run test:scripts:media
      - name: Create canonical PR checksum
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const { readFileSync, writeFileSync } = require("node:fs");

          const digest = createHash("sha256").update(readFileSync("openwrangler.vsix")).digest("hex");
          writeFileSync("openwrangler.vsix.sha256", `${digest}  openwrangler.vsix\n`);
      - name: Revalidate canonical PR checksum
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const receipt = readFileSync("openwrangler.vsix.sha256", "utf8");
          const match = /^([0-9a-f]{64})  openwrangler\.vsix\n$/u.exec(receipt);
          if (!match) throw new Error("The canonical PR checksum receipt is malformed.");
          const actual = createHash("sha256").update(readFileSync("openwrangler.vsix")).digest("hex");
          if (actual !== match[1]) throw new Error("The canonical PR VSIX checksum changed before upload.");
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: openwrangler-vsix
          path: |
            openwrangler.vsix
            openwrangler.vsix.sha256
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          overwrite: true

  contract-tests:
    name: Contract tests
    needs: classify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.full_matrix_required != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: python -m pip install --no-deps "https://files.pythonhosted.org/packages/90/b0/114463d056b6b328d45557001e848b8ab15539bd8f4fa7a457ccb83e2b5d/uv-0.11.32-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=3da76cd4e2697de30928b8a8524bd39183ac1e08cb7e72833807c022b7cba6c4"
      - name: Python lint and strict types
        run: npm run lint:python
      - name: Brand asset freshness
        run: npm run brand:check
      - name: Remote Jupyter lock integrity
        run: npm run check:remote-jupyter-lock
      - name: Remote Jupyter lock reproducibility
        run: npm run lock:remote-jupyter:check
      - name: Script contracts
        run: npm run test:scripts:portable

  visual-accessibility:
    name: Visual and accessibility
    needs: classify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.full_matrix_required != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:webview-acceptance
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: webview-visual-evidence
          path: |
            tmp/screenshots-actual/
            tmp/screenshots-diff/
          if-no-files-found: ignore

  production-audits:
    name: Production dependency audits
    needs: classify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.full_matrix_required != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: npm audit --omit=dev
      - run: npm run audit:python

  linux-packaged-editor:
    name: Packaged VS Code (Linux)
    needs: [classify, canonical-vsix]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.full_matrix_required != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the canonical PR artifact
        if: ${{ needs.canonical-vsix.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwrangler-vsix
          path: canonical-vsix
      - name: Verify canonical PR checksum
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const receipt = readFileSync("canonical-vsix/openwrangler.vsix.sha256", "utf8");
          const match = /^([0-9a-f]{64})  openwrangler\.vsix\n$/u.exec(receipt);
          if (!match) throw new Error("The canonical PR checksum receipt is malformed.");
          const actual = createHash("sha256")
            .update(readFileSync("canonical-vsix/openwrangler.vsix"))
            .digest("hex");
          if (actual !== match[1]) throw new Error("The canonical PR VSIX checksum does not match.");
      - run: npm run verify:vsix -- canonical-vsix/openwrangler.vsix
      - run: npm run build:test-extension
      - id: packaged_editor
        name: Test packaged editor
        run: node scripts/run-packaged-editor-tests.mjs canonical-vsix/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          VSCODE_TEST_VERSION: stable
      - name: Upload packaged-editor failure diagnostics
        if: ${{ !cancelled() && steps.packaged_editor.outcome == 'failure' && steps.packaged_editor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packaged-editor-diagnostics-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  released-jupyter:
    name: VS Code with released Jupyter
    needs: [classify, canonical-vsix]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'pull_request' &&
        needs.classify.outputs.full_matrix_required == 'true' &&
        needs.classify.outputs.released_jupyter_required == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require the canonical PR artifact
        if: ${{ needs.canonical-vsix.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: python -m pip install --no-deps "https://files.pythonhosted.org/packages/90/b0/114463d056b6b328d45557001e848b8ab15539bd8f4fa7a457ccb83e2b5d/uv-0.11.32-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=3da76cd4e2697de30928b8a8524bd39183ac1e08cb7e72833807c022b7cba6c4"
      - run: npm run lock:remote-jupyter:check
      - run: npm run audit:remote-jupyter
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwrangler-vsix
          path: canonical-vsix
      - name: Verify canonical PR checksum
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const receipt = readFileSync("canonical-vsix/openwrangler.vsix.sha256", "utf8");
          const match = /^([0-9a-f]{64})  openwrangler\.vsix\n$/u.exec(receipt);
          if (!match) throw new Error("The canonical PR checksum receipt is malformed.");
          const actual = createHash("sha256")
            .update(readFileSync("canonical-vsix/openwrangler.vsix"))
            .digest("hex");
          if (actual !== match[1]) throw new Error("The canonical PR VSIX checksum does not match.");
      - run: npm run verify:vsix -- canonical-vsix/openwrangler.vsix
      - run: npm run build:test-extension
      - id: prepare_xvfb
        name: Prepare pinned private Xvfb
        shell: node {0}
        run: |
          const { execFileSync } = require("node:child_process");
          const { X_OK } = require("node:constants");
          const { accessSync, appendFileSync, lstatSync } = require("node:fs");
          const { isAbsolute } = require("node:path");

          const output = execFileSync(process.execPath, ["scripts/prepare-xvfb.mjs", "--print-path"], {
            cwd: process.cwd(),
            encoding: "utf8",
            stdio: ["ignore", "pipe", "inherit"]
          });
          if (!/^[^\0\r\n]+\n?$/u.test(output)) {
            throw new Error("The Xvfb preparer must print exactly one path.");
          }
          const executable = output.endsWith("\n") ? output.slice(0, -1) : output;
          if (!isAbsolute(executable)) throw new Error("The prepared Xvfb path must be absolute.");
          const stat = lstatSync(executable);
          if (!stat.isFile() || stat.isSymbolicLink()) {
            throw new Error("The prepared Xvfb path must be a regular, non-symlink file.");
          }
          accessSync(executable, X_OK);
          appendFileSync(process.env.GITHUB_OUTPUT, `executable=${executable}\n`, "utf8");
      - id: packaged_editor
        name: Test released Jupyter in the canonical packaged VS Code
        run: node scripts/run-packaged-editor-tests.mjs canonical-vsix/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_XVFB_EXECUTABLE: ${{ steps.prepare_xvfb.outputs.executable }}
          OPEN_WRANGLER_REAL_JUPYTER_EXTENSION: "1"
          OPEN_WRANGLER_REAL_REMOTE_JUPYTER: "1"
          VSCODE_TEST_VERSION: stable
      - name: Upload packaged-editor failure diagnostics
        if: ${{ !cancelled() && steps.packaged_editor.outcome == 'failure' && steps.packaged_editor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: released-jupyter-diagnostics-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  coverage:
    needs: classify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.full_matrix_required != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: python -m pip install -e "python[dev]"
      - run: python -m pip install "pandas>=2.2,<3.0" "pyspark[connect]==4.2.0"
      - name: Verify exact coverage runtimes
        shell: bash
        run: |
          python - <<'PY'
          import pandas
          import pyspark
          from packaging.version import Version

          assert pyspark.__version__ == "4.2.0", pyspark.__version__
          assert Version("2.2") <= Version(pandas.__version__) < Version("3"), pandas.__version__
          PY
          java -XshowSettings:properties -version 2>&1 |
            grep -Eq '^[[:space:]]*java\.specification\.version = 17$'
      - run: npm run test:coverage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-reports
          path: |
            coverage/
            tmp/coverage/python.xml

  python-matrix:
    needs: classify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.full_matrix_required != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v6
        if: matrix.python == '3.10'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: matrix.python == '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - name: Pin the declared DuckDB minimum
        if: matrix.python == '3.14'
        run: python -m pip install --force-reinstall --no-deps "duckdb==1.5.4"
      - run: npm run test:python-environment-smoke
        if: matrix.python == '3.10'
      - run: python -m pytest python/tests -q

  extension-host:
    needs: classify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.full_matrix_required != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.106.0", "stable"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e "python[dev]"
      - run: npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  native-script-portability:
    name: Native script contracts (Windows)
    needs: classify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.full_matrix_required != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:scripts:native

  native-extension-host:
    name: Native extension host (${{ matrix.os }})
    needs: classify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.full_matrix_required != 'false') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: stable

  native-editor-matrix:
    name: Native editor (${{ matrix.os }})
    needs: [classify, canonical-vsix]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.full_matrix_required != 'false') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Require the canonical PR artifact
        if: ${{ needs.canonical-vsix.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwrangler-vsix
          path: canonical-vsix
      - name: Verify canonical PR checksum
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const receipt = readFileSync("canonical-vsix/openwrangler.vsix.sha256", "utf8");
          const match = /^([0-9a-f]{64})  openwrangler\.vsix\n$/u.exec(receipt);
          if (!match) throw new Error("The canonical PR checksum receipt is malformed.");
          const actual = createHash("sha256")
            .update(readFileSync("canonical-vsix/openwrangler.vsix"))
            .digest("hex");
          if (actual !== match[1]) throw new Error("The canonical PR VSIX checksum does not match.");
      - run: npm run verify:vsix -- canonical-vsix/openwrangler.vsix
      - run: npm run build:test-extension
      - id: packaged_editor
        name: Test packaged editor
        run: node scripts/run-packaged-editor-tests.mjs canonical-vsix/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: vscode
          VSCODE_TEST_VERSION: stable
      - name: Upload packaged-editor failure diagnostics
        if: ${{ !cancelled() && steps.packaged_editor.outcome == 'failure' && steps.packaged_editor.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packaged-editor-diagnostics-vscode-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.packaged_editor.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  native-cursor-smoke:
    name: Cursor smoke (${{ matrix.os }})
    needs: [classify, canonical-vsix]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.full_matrix_required != 'false') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Require the canonical PR artifact
        if: ${{ needs.canonical-vsix.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwrangler-vsix
          path: canonical-vsix
      - name: Verify canonical PR checksum
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const receipt = readFileSync("canonical-vsix/openwrangler.vsix.sha256", "utf8");
          const match = /^([0-9a-f]{64})  openwrangler\.vsix\n$/u.exec(receipt);
          if (!match) throw new Error("The canonical PR checksum receipt is malformed.");
          const actual = createHash("sha256")
            .update(readFileSync("canonical-vsix/openwrangler.vsix"))
            .digest("hex");
          if (actual !== match[1]) throw new Error("The canonical PR VSIX checksum does not match.");
      - run: npm run verify:vsix -- canonical-vsix/openwrangler.vsix
      - run: npm run build:test-extension
      - id: cursor_smoke
        name: Test pinned Cursor platform smoke
        run: node scripts/run-packaged-editor-tests.mjs canonical-vsix/openwrangler.vsix
        env:
          OPEN_WRANGLER_PACKAGED_EDITORS: cursor
          OPEN_WRANGLER_PACKAGED_MODE: platform-smoke
      - name: Upload Cursor-smoke failure diagnostics
        if: ${{ !cancelled() && steps.cursor_smoke.outcome == 'failure' && steps.cursor_smoke.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packaged-editor-diagnostics-cursor-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ steps.cursor_smoke.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

  remote-workspace:
    name: Remote SSH acceptance
    needs: [classify, canonical-vsix]
    if: >-
      ${{
        !cancelled() &&
        needs.classify.outputs.full_matrix_required == 'true' &&
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'acceptance:remote-ssh')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require the canonical PR artifact
        if: ${{ needs.canonical-vsix.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Prepare namespace-capable acceptance host
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap \
            busybox-static \
            coreutils \
            iproute2 \
            libtomcrypt1 \
            libtommath1 \
            openssh-client \
            procps \
            python3-venv \
            x11-xkb-utils
          system_runtime_ancestors=(
            /usr
            /etc
          )
          runner_uid="$(id -u)"
          for directory in "${system_runtime_ancestors[@]}"; do
            test -d "$directory"
            test ! -L "$directory"
            test "$(realpath "$directory")" = "$directory"
            owner="$(stat --format='%u' "$directory")"
            test "$owner" = "0" || test "$owner" = "$runner_uid"
          done
          sudo chown --no-dereference root:root -- "${system_runtime_ancestors[@]}"
          sudo chmod go-w -- "${system_runtime_ancestors[@]}"
          for directory in / "${system_runtime_ancestors[@]}"; do
            test -d "$directory"
            test ! -L "$directory"
            test "$(realpath "$directory")" = "$directory"
            test "$(stat --format='%u:%g' "$directory")" = "0:0"
            test -z "$(find "$directory" -maxdepth 0 -perm /022 -print -quit)"
            test ! -w "$directory"
          done
          system_runtime_roots=(
            /usr/share/fontconfig
            /usr/share/fonts
            /usr/share/glib-2.0
            /usr/share/icons
            /usr/share/mime
            /usr/share/X11
            /usr/share/zoneinfo
          )
          test ! -L /usr/share
          test "$(realpath /usr/share)" = "/usr/share"
          test "$(stat --format='%u' /usr/share)" = "0"
          sudo chmod go-w -- /usr/share
          test ! -w /usr/share
          for directory in "${system_runtime_roots[@]}"; do
            test ! -L "$directory"
            test "$(realpath "$directory")" = "$directory"
            test "$(stat --format='%u' "$directory")" = "0"
          done
          sudo chmod --recursive go-w -- "${system_runtime_roots[@]}"
          for directory in "${system_runtime_roots[@]}"; do
            test ! -L "$directory"
            test "$(realpath "$directory")" = "$directory"
            test "$(stat --format='%u' "$directory")" = "0"
            unsafe_owner="$(find "$directory" -xdev ! -user root -print -quit)"
            unsafe_mode="$(find "$directory" -xdev \( -type d -o -type f \) -perm /022 -print -quit)"
            unsafe_type="$(find "$directory" -xdev ! -type d ! -type f ! -type l -print -quit)"
            test -z "$unsafe_owner"
            test -z "$unsafe_mode"
            test -z "$unsafe_type"
          done
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          test "$(sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = "0"
          test "$(sysctl --values kernel.unprivileged_userns_clone)" = "1"
          test "$(sysctl --values user.max_user_namespaces)" -gt 0
      - run: npm ci
      - run: /usr/bin/python3 -m venv .remote-venv
      - run: .remote-venv/bin/python -m pip install --upgrade pip
      - run: .remote-venv/bin/python -m pip install ./python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwrangler-vsix
          path: canonical-vsix
      - id: candidate
        name: Verify exact Remote SSH candidate
        shell: node {0}
        run: |
          const { createHash } = require("node:crypto");
          const { appendFileSync, readFileSync, statSync } = require("node:fs");
          const { resolve } = require("node:path");

          const candidatePath = resolve("canonical-vsix/openwrangler.vsix");
          const receipt = readFileSync("canonical-vsix/openwrangler.vsix.sha256", "utf8");
          const match = /^([0-9a-f]{64})  openwrangler\.vsix\n$/u.exec(receipt);
          if (!match) throw new Error("The canonical PR checksum receipt is malformed.");
          const bytes = readFileSync(candidatePath);
          const sha256 = createHash("sha256").update(bytes).digest("hex");
          if (sha256 !== match[1]) throw new Error("The canonical PR VSIX checksum does not match.");
          const size = statSync(candidatePath).size;
          if (!Number.isSafeInteger(size) || size <= 0) {
            throw new Error("The canonical PR VSIX size is invalid.");
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `path=${candidatePath}\nsha256=${sha256}\nsize=${size}\n`,
            "utf8"
          );
      - run: npm run verify:vsix -- canonical-vsix/openwrangler.vsix
      - id: remote_workspace
        name: Test packaged VS Code over Remote SSH
        run: >-
          npm run test:remote-workspace --
          ${{ steps.candidate.outputs.path }}
          ${{ steps.candidate.outputs.sha256 }}
          ${{ steps.candidate.outputs.size }}
        env:
          OPEN_WRANGLER_EDITOR_DISPLAY: xvfb
          OPEN_WRANGLER_REMOTE_PYTHON: ${{ github.workspace }}/.remote-venv/bin/python

  validate:
    needs:
      - classify
      - fast-feedback
      - contract-tests
      - visual-accessibility
      - production-audits
      - canonical-vsix
      - linux-packaged-editor
      - coverage
      - python-matrix
      - extension-host
      - native-script-portability
      - native-extension-host
      - native-editor-matrix
      - native-cursor-smoke
      - released-jupyter
      - remote-workspace
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Require every blocking CI result
        run: node scripts/require-ci-results.mjs
        env:
          DOCUMENTATION_ONLY: ${{ needs.classify.outputs.documentation_only }}
          DRAFT_PULL_REQUEST: ${{ needs.classify.outputs.draft_pull_request }}
          LIGHTWEIGHT_ONLY: ${{ needs.classify.outputs.lightweight_only }}
          PACKAGE_ONLY: ${{ needs.classify.outputs.package_only }}
          FULL_MATRIX_REQUIRED: ${{ needs.classify.outputs.full_matrix_required }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FAST_FEEDBACK_RESULT: ${{ needs.fast-feedback.result }}
          CONTRACT_TESTS_RESULT: ${{ needs.contract-tests.result }}
          VISUAL_ACCESSIBILITY_RESULT: ${{ needs.visual-accessibility.result }}
          PRODUCTION_AUDITS_RESULT: ${{ needs.production-audits.result }}
          CANONICAL_VSIX_RESULT: ${{ needs.canonical-vsix.result }}
          LINUX_PACKAGED_EDITOR_RESULT: ${{ needs.linux-packaged-editor.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          PYTHON_MATRIX_RESULT: ${{ needs.python-matrix.result }}
          EXTENSION_HOST_RESULT: ${{ needs.extension-host.result }}
          NATIVE_SCRIPT_PORTABILITY_RESULT: ${{ needs.native-script-portability.result }}
          NATIVE_EXTENSION_HOST_RESULT: ${{ needs.native-extension-host.result }}
          NATIVE_EDITOR_MATRIX_RESULT: ${{ needs.native-editor-matrix.result }}
          NATIVE_CURSOR_SMOKE_RESULT: ${{ needs.native-cursor-smoke.result }}
          RELEASED_JUPYTER_RESULT: ${{ needs.released-jupyter.result }}
          RELEASED_JUPYTER_REQUIRED: ${{ needs.classify.outputs.released_jupyter_required }}
          REMOTE_WORKSPACE_RESULT: ${{ needs.remote-workspace.result }}
          REMOTE_WORKSPACE_REQUIRED: >-
            ${{
              github.event_name == 'pull_request' &&
              needs.classify.outputs.full_matrix_required == 'true' &&
              contains(github.event.pull_request.labels.*.name, 'acceptance:remote-ssh')
            }}
