name: Bug report
description: Report a reproducible problem with Open Wrangler.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not use a public issue for a security vulnerability. [Report it privately through GitHub](https://github.com/Matt17BR/openwrangler/security/advisories/new).

        Use synthetic or redacted material. Do not attach proprietary data, personal data, credentials, notebook secrets, or full environment dumps.

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe the failure, including any error shown and when it occurs.
      placeholder: Tell us what Open Wrangler did.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected Open Wrangler to do instead.
      placeholder: Tell us the expected result.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Provide numbered steps and the smallest synthetic data or code needed to reproduce the problem. If the problem is intermittent, describe the sequence and frequency without including real data.
      placeholder: |
        1. Create a file or variable with this synthetic shape...
        2. Open it in Open Wrangler...
        3. Run this action...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Copy the Open Wrangler version from the Extensions view and the editor version from Help > About. List other exact versions when they matter; say when a value could not be found.
      placeholder: |
        Open Wrangler:
        Editor (VS Code or Cursor):
        Operating system:
        Python or R (if relevant):
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did the problem happen?
      options:
        - Notebook inline preview below a cell
        - Open Wrangler editor or data grid
        - Notebook variable picker or Open in Open Wrangler action
        - Python Interactive window
        - R script, document, notebook, or terminal
        - Exported data or generated script
        - Extension installation, activation, or startup
        - Other or unsure
    validations:
      required: true

  - type: dropdown
    id: dataframe-backend
    attributes:
      label: Dataframe backend
      description: Select the backend if it is relevant to the problem.
      options:
        - Pandas
        - Polars
        - DuckDB
        - PySpark
        - Native R
        - Not sure or not applicable

  - type: dropdown
    id: input-format
    attributes:
      label: Data source or input format
      description: Select the source if it is relevant to the problem.
      options:
        - CSV or TSV
        - Excel
        - Parquet
        - JSON Lines
        - Notebook variable or result
        - R script, document, notebook, or terminal
        - Not sure or not applicable

  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted Open Wrangler diagnostics
      description: Paste only the smallest relevant excerpt from the Open Wrangler output channel. Replace file paths, host names, user content, and identifiers with placeholders. Do not paste a full environment dump.
      placeholder: Paste a short, redacted excerpt if one is available.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched open and closed issues for the same problem.
          required: true
        - label: I included only synthetic or redacted material and removed proprietary data, personal data, credentials, secrets, and full environment dumps.
          required: true
