name: marketplace-$(Date:yyyyMMdd).$(Rev:r)

trigger:
  batch: false
  branches:
    include:
      - main
  tags:
    include:
      - "v*"

pr: none

parameters:
  - name: marketplaceServiceConnection
    displayName: Marketplace WIF service connection
    type: string
    default: openwrangler-marketplace-publishing
    values:
      - openwrangler-marketplace-publishing
  - name: existingReleaseTag
    displayName: Existing GitHub release tag (manual protected-main runs only)
    type: string
    default: ""

stages:
  - stage: Intake
    displayName: Bind immutable release tag
    jobs:
      - job: Bind
        displayName: Validate release source
        timeoutInMinutes: 10
        pool:
          vmImage: ubuntu-24.04
        workspace:
          clean: all
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            fetchTags: true
            persistCredentials: false
          - task: NodeTool@0
            displayName: Use pinned Node.js
            inputs:
              versionSpec: 22.22.0
              checkLatest: false
          - script: node scripts/marketplace-release-intake.mjs
            name: release_intake
            displayName: Classify the exact tag and package channel
            env:
              BUILD_REASON: $(Build.Reason)
              BUILD_SOURCEBRANCH: $(Build.SourceBranch)
              BUILD_SOURCEVERSION: $(Build.SourceVersion)
              EXISTING_RELEASE_TAG: ${{ parameters.existingReleaseTag }}

  - stage: Promote
    displayName: Promote canonical GitHub release to Marketplace
    dependsOn: Intake
    condition: and(succeeded(), eq(dependencies.Intake.outputs['Bind.release_intake.promote'], 'true'))
    lockBehavior: sequential
    jobs:
      - deployment: Marketplace
        displayName: Publish and verify Microsoft Marketplace
        timeoutInMinutes: 240
        pool:
          vmImage: ubuntu-24.04
        workspace:
          clean: all
        environment: openwrangler-marketplace-publishing
        variables:
          releaseCommit: $[stageDependencies.Intake.Bind.outputs['release_intake.releaseCommit']]
          releasePrerelease: $[stageDependencies.Intake.Bind.outputs['release_intake.releasePrerelease']]
          releaseTag: $[stageDependencies.Intake.Bind.outputs['release_intake.releaseTag']]
          releaseVersion: $[stageDependencies.Intake.Bind.outputs['release_intake.releaseVersion']]
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true
                  fetchDepth: 0
                  fetchTags: true
                  persistCredentials: false
                - task: NodeTool@0
                  displayName: Use pinned Node.js
                  inputs:
                    versionSpec: 22.22.0
                    checkLatest: false
                - script: npm ci --ignore-scripts
                  displayName: Restore the reviewed lockfile
                - script: node scripts/download-canonical-github-release.mjs canonical-release
                  displayName: Download the exact public GitHub release
                  env:
                    OPEN_WRANGLER_GITHUB_RELEASE_ATTEMPTS: 210
                    OPEN_WRANGLER_GITHUB_RELEASE_DELAY_MS: 60000
                    RELEASE_PRERELEASE: $(releasePrerelease)
                    RELEASE_TAG: $(releaseTag)
                - script: node scripts/verify-registry-release-artifact.mjs canonical-release
                  displayName: Verify the canonical release before authentication
                  env:
                    AUTOMATION_SHA: $(Build.SourceVersion)
                    EXPECTED_SHA: $(releaseCommit)
                    RELEASE_PRERELEASE: $(releasePrerelease)
                    RELEASE_TAG: $(releaseTag)
                - script: |
                    set -euo pipefail
                    pwd -P | grep -Fqx -- "$AUTOMATION_ROOT"
                    test ! -e release-source
                    test ! -L release-source
                    git worktree add --detach release-source "$RELEASE_COMMIT"
                    git -C release-source rev-parse --verify HEAD^{commit} | grep -Fqx -- "$RELEASE_COMMIT"
                    git -C release-source rev-parse --show-toplevel | grep -Fqx -- "$AUTOMATION_ROOT/release-source"
                    git -C release-source status --porcelain=v1 --untracked-files=all | cmp -s - /dev/null
                  displayName: Materialize the exact clean release source
                  env:
                    AUTOMATION_ROOT: $(System.DefaultWorkingDirectory)
                    RELEASE_COMMIT: $(releaseCommit)
                - script: |
                    set -euo pipefail
                    boundary="$(node --input-type=module -e 'import { releaseCutoverVersion } from "./scripts/release-cutovers.mjs"; process.stdout.write(releaseCutoverVersion("public-media-prepublication"));')"
                    required="$(node --input-type=module -e 'import { publicMediaPrepublicationRequired } from "./scripts/public-media-surface-contract.mjs"; process.stdout.write(String(publicMediaPrepublicationRequired(process.env.RELEASE_VERSION)));')"
                    case "$required" in
                      true)
                        npm ci --ignore-scripts --prefix release-source
                        node release-source/scripts/verify-public-media-surfaces.mjs --source-sha "$RELEASE_SOURCE_SHA" --version "$RELEASE_VERSION" --prepublish
                        ;;
                      false)
                        printf 'Prepublication public-media verification starts with v%s; historical %s recovery is unchanged.\n' "$boundary" "$RELEASE_VERSION"
                        ;;
                      *) exit 64 ;;
                    esac
                  displayName: Preflight immutable public README media
                  env:
                    RELEASE_SOURCE_SHA: $(releaseCommit)
                    RELEASE_VERSION: $(releaseVersion)
                - script: node scripts/verify-marketplace-publication.mjs canonical-release --probe-existing
                  displayName: Reuse an exact existing public Marketplace payload
                  env:
                    AUTOMATION_SHA: $(Build.SourceVersion)
                    EXPECTED_SHA: $(releaseCommit)
                    RELEASE_PRERELEASE: $(releasePrerelease)
                    RELEASE_TAG: $(releaseTag)
                - task: AzureCLI@2
                  displayName: Publish with the federated Marketplace identity
                  condition: and(succeeded(), ne(variables['marketplaceAlreadyPublic'], 'true'))
                  inputs:
                    azureSubscription: ${{ parameters.marketplaceServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      node scripts/marketplace-identity-profile.mjs
                      npx --no-install vsce verify-pat Matt17BR --azure-credential
                      node scripts/verify-registry-release-artifact.mjs canonical-release
                      publish_status=0
                      if [ "$RELEASE_PRERELEASE" = "true" ]; then
                        npx --no-install vsce publish --azure-credential --packagePath canonical-release/openwrangler.vsix --pre-release --skip-duplicate || publish_status=$?
                      elif [ "$RELEASE_PRERELEASE" = "false" ]; then
                        npx --no-install vsce publish --azure-credential --packagePath canonical-release/openwrangler.vsix --skip-duplicate || publish_status=$?
                      else
                        exit 64
                      fi
                      if [ "$publish_status" -ne 0 ]; then
                        echo "vsce publish exited with status $publish_status; public verification will determine the result." >&2
                      fi
                    addSpnToEnvironment: false
                    visibleAzLogin: false
                    failOnStandardError: false
                  env:
                    AUTOMATION_SHA: $(Build.SourceVersion)
                    EXPECTED_SHA: $(releaseCommit)
                    RELEASE_PRERELEASE: $(releasePrerelease)
                    RELEASE_TAG: $(releaseTag)
                - script: node scripts/verify-marketplace-publication.mjs canonical-release
                  displayName: Verify the public Marketplace payload
                  condition: and(succeeded(), ne(variables['marketplaceAlreadyPublic'], 'true'))
                  env:
                    AUTOMATION_SHA: $(Build.SourceVersion)
                    EXPECTED_SHA: $(releaseCommit)
                    OPEN_WRANGLER_MARKETPLACE_VERIFY_ATTEMPTS: 40
                    RELEASE_PRERELEASE: $(releasePrerelease)
                    RELEASE_TAG: $(releaseTag)
