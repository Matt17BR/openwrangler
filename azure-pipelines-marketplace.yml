name: marketplace-$(Date:yyyyMMdd).$(Rev:r)

trigger:
  batch: true
  branches:
    exclude:
      - "*"
  tags:
    include:
      - "v*"

pr: none

parameters:
  - name: marketplaceServiceConnection
    displayName: Marketplace WIF service connection
    type: string
    default: openwrangler-marketplace-publishing
    values:
      - openwrangler-marketplace-publishing

stages:
  - stage: Intake
    displayName: Bind immutable stable tag
    jobs:
      - job: Bind
        displayName: Validate release source
        timeoutInMinutes: 10
        pool:
          vmImage: ubuntu-24.04
        workspace:
          clean: all
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            fetchTags: true
            persistCredentials: false
          - task: NodeTool@0
            displayName: Use Node.js 22
            inputs:
              versionSpec: 22.x
              checkLatest: false
          - script: node scripts/marketplace-release-intake.mjs
            name: release_intake
            displayName: Classify the exact tag and package channel
            env:
              BUILD_SOURCEBRANCH: $(Build.SourceBranch)
              BUILD_SOURCEVERSION: $(Build.SourceVersion)

  - stage: Promote
    displayName: Promote canonical GitHub release to Marketplace
    dependsOn: Intake
    condition: and(succeeded(), eq(dependencies.Intake.outputs['Bind.release_intake.stable'], 'true'))
    lockBehavior: sequential
    jobs:
      - deployment: Marketplace
        displayName: Publish and verify Microsoft Marketplace
        timeoutInMinutes: 30
        pool:
          vmImage: ubuntu-24.04
        workspace:
          clean: all
        environment: openwrangler-marketplace-publishing
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true
                  fetchDepth: 0
                  fetchTags: true
                  persistCredentials: false
                - task: NodeTool@0
                  displayName: Use Node.js 22
                  inputs:
                    versionSpec: 22.x
                    checkLatest: false
                - script: npm ci --ignore-scripts
                  displayName: Restore the reviewed lockfile
                - script: node scripts/download-canonical-github-release.mjs canonical-release
                  displayName: Download the exact public GitHub release
                  env:
                    RELEASE_TAG: $(Build.SourceBranchName)
                - script: node scripts/verify-canonical-release-artifact.mjs canonical-release
                  displayName: Verify the canonical release before authentication
                  env:
                    EXPECTED_SHA: $(Build.SourceVersion)
                    RELEASE_TAG: $(Build.SourceBranchName)
                - task: AzureCLI@2
                  displayName: Publish with the federated Marketplace identity
                  inputs:
                    azureSubscription: ${{ parameters.marketplaceServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      npx --no-install vsce verify-pat Matt17BR --azure-credential
                      node scripts/verify-canonical-release-artifact.mjs canonical-release
                      npx --no-install vsce publish --azure-credential --packagePath canonical-release/openwrangler.vsix --skip-duplicate
                    addSpnToEnvironment: false
                    visibleAzLogin: false
                    failOnStandardError: false
                  env:
                    EXPECTED_SHA: $(Build.SourceVersion)
                    RELEASE_TAG: $(Build.SourceBranchName)
                - script: node scripts/verify-marketplace-publication.mjs canonical-release
                  displayName: Verify the public Marketplace payload
                  env:
                    EXPECTED_SHA: $(Build.SourceVersion)
                    RELEASE_TAG: $(Build.SourceBranchName)
