[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openwrangler-runtime"
dynamic = ["version"]
description = "Runtime backend for the Open Wrangler VS Code extension."
requires-python = ">=3.10"
dependencies = [
  # BEGIN GENERATED PYTHON RUNTIME DEPENDENCIES
  "polars>=1.35.2,<2",
  "duckdb>=1.5.4,<1.6",
  "fsspec==2026.7.0",
  "pytz>=2026.3.post1,<2027",
  "pandas>=2.3.3,<4",
  "pyarrow>=25,<26",
  "openpyxl>=3.1.5,<4",
  "xlrd>=2.0.2,<3",
  "ipython>=9.15.0,<10",
  # END GENERATED PYTHON RUNTIME DEPENDENCIES
]

[project.optional-dependencies]
dev = [
  "setuptools>=83.0.0",
  "pytest",
  "pytest-cov",
  "nbclient",
  "nbformat",
  "ipykernel",
  # BEGIN GENERATED PYTHON OPTIONAL RUNTIME DEPENDENCIES
  "fastexcel>=0.20.2,<1",
  # END GENERATED PYTHON OPTIONAL RUNTIME DEPENDENCIES
  "tornado>=6.5.7",
  "ruff",
  "pip-audit"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openwrangler_runtime*"]

[tool.setuptools.dynamic]
version = { attr = "openwrangler_runtime.version.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["openwrangler_runtime", "tests"]
